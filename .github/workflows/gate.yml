# The no-shell/no-python gate, wired into CI (bead omp-orchestrator-4ak).
#
# Two legs on purpose: the binary is the direct scan (fails the step on any
# tracked .sh/.py), and `cargo test -p no-shell-gate` re-runs the gate's own
# red/green battery — so the gate fires in CI even when a change is never
# exercised by a local `cargo test`, and locally even when CI is skipped.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  no-shell-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # Acceptance 3 (bead omp-orchestrator-workspace-load-gate-of3): the
      # workspace LOADS as its own step, BEFORE and independently of the gate
      # steps — a manifest break is attributed to itself, not surfaced as a
      # mysterious gate failure.
      - name: Workspace loads
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Gate binary — refuse tracked .sh/.py
        run: cargo run --quiet -p no-shell-gate
      - name: Gate tests — red/green legs and the real-tree leg
        run: cargo test -p no-shell-gate
  path-literal-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p path-literal-guard
  undrained-pipe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p undrained-pipe-lint
      - name: Scan checked-out workspace for undrained-pipe pattern
        run: cargo run --quiet -p undrained-pipe-lint -- .
  kernel-bypass-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p kernel-bypass-gate
      - name: Scan checked-out workspace for kernel bypasses
        run: cargo run --quiet -p kernel-bypass-gate -- .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p state-wildcard-lint
      - name: Reject wildcard arms on state-like enums
        run: cargo run --quiet -p state-wildcard-lint -- .
  installer:
    # WIRING: the installer was BUILT, tested and hardened this session and was
    # invoked by nothing — caught by wired_lanes, not by a human. `--check`
    # compares the binaries the workspace declares against what is installed and
    # exits nonzero on drift, so it is a real gate rather than a smoke run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p installer
      - name: installer --check must agree with the workspace
        run: cargo run --quiet -p installer -- --check
  omp-inventory-map:
    # WIRING: this is one of the eight gates §06 is built around and CI did not
    # invoke it. Caught by wired_lanes, not by a human. the only gate that mutates a real filesystem tree (TREE leg); it was never run by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p omp-inventory-map
      - run: cargo run --quiet -p omp-inventory-map -- .
  pre-delete-citation-check:
    # WIRING: this is one of the eight gates §06 is built around and CI did not
    # invoke it. Caught by wired_lanes, not by a human. refuses a delete whose citation is unresolved; never run by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p pre-delete-citation-check
      - run: cargo run --quiet -p pre-delete-citation-check -- .
  commit-build-fence:
    # WIRING: this is one of the eight gates §06 is built around and CI did not
    # invoke it. Caught by wired_lanes, not by a human. refuses a commit that does not build; never run by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p commit-build-fence
      - run: cargo run --quiet -p commit-build-fence -- .

  porting-gate:
    # WIRING: a candidate must pass all six arrival clauses from the same archive state.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p porting-gate
      - name: Gate candidate porting-gate from clean archive
        run: cargo run --quiet -p porting-gate -- --repo . --crate porting-gate
