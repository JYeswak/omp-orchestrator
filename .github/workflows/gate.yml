# The no-shell/no-python gate, wired into CI (bead omp-orchestrator-4ak).
#
# Two legs on purpose: the binary is the direct scan (fails the step on any
# tracked .sh/.py), and `cargo test -p no-shell-gate` re-runs the gate's own
# red/green battery — so the gate fires in CI even when a change is never
# exercised by a local `cargo test`, and locally even when CI is skipped.
#
# TOOLCHAIN PARITY (2026-09-02, CORRECTED 2026-09-03). Every job carries a
# `Rust toolchain` step for one measured reason: `gh run list --limit 200`
# returned 67 runs and 67 failures, and three independently-failing jobs all
# died at `error[E0554]: #![feature] may not be used on the stable release
# channel` compiling `asupersync`.
#
# RETRACTED: "The runner default is stable; this workspace is nightly." That was
# true on 2026-09-02 and is false now. `asupersync` never required nightly — its
# DEFAULT feature set did (`default = ["proc-macros", "nightly-outcome-try"]`).
# The workspace now depends with `default-features = false, features =
# ["proc-macros"]` through one root `[workspace.dependencies]` entry, and
# `rust-toolchain.toml` pins **stable**. Measured 2026-09-03 by the
# AsupersyncStable lane on rustc 1.98.0: `cargo check --workspace --all-targets`
# exits 0 with no E0554, and every package this workflow builds compiles on
# stable with tests included. The runner default and the pin now AGREE, which is
# the strongest form of parity available — the previous arrangement made the daily
# push depend on a dated nightly that gets garbage-collected.
#
# The STEPS are unchanged and stay: they run `rustup show active-toolchain` plus
# `cargo --version` / `rustc --version` and install no literal channel string, so
# they are channel-agnostic and survived the flip untouched. They exist so that a
# toolchain resolution failure is attributed to ITSELF rather than surfacing as a
# mysterious gate failure, which is the same reason `Workspace loads` is its own
# step.
#
# CORRECTED 2026-09-07 (omp-orchestrator-fsu7): the previous sentence read "GitHub
# Actions does not resolve YAML anchors, so the step is repeated per job rather than
# shared." That was true of a twelve-job workflow and is now moot -- there is ONE job,
# so there is nothing to repeat and no anchor to want. Retained as provenance because
# the repetition was a deliberate response to a measured 67-run outage, not clutter.
#
# HISTORICAL EXCLUSION NOTE: this was the pre-3b5u worktree-only state. The
# committed-tree job below now builds the complete archived workspace, including
# these crates, so this note is retained only as incident provenance:
#   - crates/loop-driver — previously failed with an upstream-gated API.
#   - crates/fleet-monitor — previously failed with missing Stdio imports.
# The current archive gate is the authority for whether HEAD compiles. Do not
# infer committed-tree health from a dirty checkout or from this historical note.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# ONE RUN PER PUSH, AND ONLY THE LATEST ONE.
#
# MEASURED: runs 33580661749 (2026-09-02T01:45:50Z) and 33580723669 (01:46:51Z) started
# **61 seconds apart**, and both ran all ten jobs to completion at ~20 minutes each. The
# older verdict was worthless the moment the newer sha existed, and it cost ~200 job-
# minutes to produce.
#
# `cancel-in-progress` is safe HERE for a specific reason, not as a default: every job in
# this workflow scans the WHOLE CHECKED-OUT TREE, so a later commit's verdict strictly
# covers the earlier commit's tree. It would NOT be safe for a per-commit test matrix,
# where cancelling loses a verdict nothing else reproduces.
#
# Also measured, because it is the question this file gets asked: pushing N commits fires
# ONE run, not N. `on.push` keys on the push EVENT, which carries every commit in the
# delivery. Run 33583861505 covered 11 commits (`git rev-list --count 8e8050e88..deec6e865`
# -> 11) and run 33585450134 covered 5. So the 300-commit backlog is one run.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE JOB, ONE ENTRY POINT -- omp-orchestrator-fsu7.
  #
  # WHY THIS IS ONE JOB AND NOT TWELVE. GitHub Actions is STRICT on duplicate keys:
  # measured n=60 runs, 49 duplicate-key runs started ZERO jobs. A workflow that fails
  # to parse starts nothing and reports nothing, which is indistinguishable from a gate
  # that passed. Worse, the 2026-09-06 defect was a MISSING job key that collapsed two
  # jobs into one -- silently halving coverage with no error anywhere, remedied by a
  # one-line restore. A YAML fan-out has no denominator; `gate-runner` has one.
  #
  # THE UNIT WAS ALSO WRONG, and this is the sharper finding. Counting jobs is
  # structurally blind to the fan-out, because it grows INSIDE jobs: measured 2026-09-07,
  # the twelve jobs invoked 15 distinct gate BINS across 13 crates, and a peer adding one
  # step took it to 16 while the job count sat at 12. `no-shell-gate` alone hosts THREE
  # bins. So `bins` replaced `jobs` as this reduction's denominator.
  #
  # SUBSUMPTION, PER JOB, BY NAME -- item 10 forbids deleting a job to reduce a count.
  # Ten jobs had BOTH a `cargo test -p X` half and a `cargo run` half; two were
  # test-only. Every crate below is in `gate-runner`'s derived roster (its test half),
  # and every `cargo run` half is declared in the OWNING CRATE'S OWN Cargo.toml under
  # `[package.metadata.gate]` (its run half), so the declaration travels with the crate
  # and adding a gate needs no edit here:
  #
  #   no-shell-gate               -> roster + checks: no-shell-gate (3 bins),
  #                                  asupersync-conformance, convergence-stamp
  #   head-compiles-as-committed  -> roster + checks: no-shell-gate/head-compiles-gate
  #   path-literal-guard          -> roster (TEST-ONLY job; no run half existed)
  #   grader-attribution-gate     -> roster + checks
  #   undrained-pipe-lint         -> roster + checks
  #   kernel-bypass-gate          -> roster + checks
  #   state-wildcard-lint         -> roster + checks
  #   installer                   -> roster + checks
  #   omp-inventory-map           -> roster (TEST-ONLY; its run half was DELETED earlier,
  #                                  not moved -- see that job's own former comment)
  #   pre-delete-citation-check   -> roster + checks
  #   commit-build-fence          -> roster + checks (two phases: init THEN check)
  #   porting-gate                -> roster + checks: porting-gate,
  #                                  preregistration-gate, plan-assemble
  #
  # This mapping is ENFORCED, not merely asserted here: `gate_runner::subsumption`
  # refuses a job whose binary half has no declared check and names the crate. A table
  # in a comment cannot fail; that function can.
  #
  # BOUNDARY (item 9): `m0c` remains canonical for YAML validity. This job is the entry
  # point only, and nothing here changes push cadence.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, not the default fetch-depth: 1. Unchanged from the twelve-job
          # arrangement and for the same measured reason: gates that read git (the
          # committed-tree archive check, pre-delete citation scanning) produce a verdict
          # about the CHECKOUT masquerading as a verdict about the code when the clone is
          # shallow. That false signal is what left this workflow dark for 67 runs.
          fetch-depth: 0
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
      - name: Workspace loads
        # Its OWN step so a manifest failure is attributed to itself. Measured four times
        # in one evening: a `Cargo.toml` under the `crates/*` glob with no `src/` breaks
        # workspace LOADING, so `-p <crate>` cannot dodge it and every command returns an
        # identical 101 with a completely different cause.
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: S1 coverage provenance
        run: cargo run --quiet -p s1-coverage -- --repo . --head HEAD --json
      - name: Gate roster is not vacuous
        # An empty roster is an ERROR with its own exit code, never a pass. Runs BEFORE
        # the gates so a filtered or unreadable workspace is named as such rather than
        # reported as "all gates green".
        run: cargo run --quiet -p gate-runner -- --plan
      - name: Every gate, one entry point
        run: cargo run --quiet -p gate-runner -- --run
      # THE CITATION, AND WHY IT NO LONGER ASKS GITHUB — omp-orchestrator-pxhmd.
      #
      # THIS STEP MADE CI UNSATISFIABLE FOR NINETY RUNS. It read:
      #
      #   run: cargo run --quiet -p gate-runner -- --ci-citation "${{ github.run_id }}"
      #
      # which handed the citation THE ID OF THE RUN IT WAS RUNNING INSIDE. `ci_citation` then
      # ran `gh run view <that id> --log`, and GitHub does not serve logs for an in-progress
      # run. Verbatim from run 34326877717:
      #
      #   CI_CITATION_GH_UNAVAILABLE detail=run 34326877717 is still in progress; logs will
      #     be available when it is complete
      #   ##[error]Process completed with exit code 4.
      #
      # With `if: always()` and no `continue-on-error`, it fired even when everything upstream
      # was green, so NO COMMIT COULD EVER PRODUCE A GREEN RUN. Measured 2026-09-09,
      # `gh run list --limit 100`: 75 failure, 15 cancelled, ZERO success. The same runs had
      # already printed `GATE_RUNNER crates=87 pass=67 fail=16 …` — a complete verdict,
      # computed and then discarded, which is why ninety reds carried no information: "sixteen
      # crates fail" and "the citation is impossible" looked identical from outside.
      #
      # `local` cites the aggregate the step above MEASURED, read from its own artifact, with
      # the identity from `GITHUB_RUN_ID` / `GITHUB_SHA` (set by Actions, no `env:` needed).
      # No network, no token, no log store, no race. Naming this run's id is now a typed
      # refusal (`CI_CITATION_SELF_REFERENCE`, exit 9) rather than a mystery exit 4, and
      # `latest` — which from inside CI also resolves to self — is refused the same way.
      #
      # WHAT WAS DELIBERATELY NOT DONE: the step was not deleted and `continue-on-error` was
      # not added. Both are gate self-weakening, and `tests/workflow_shape.rs` fails if either
      # appears. An absent aggregate still reds this step (exit 11) — a citation that reads
      # nothing and exits 0 is the vacuous green this repo has already paid for.
      - name: Cite gate-runner CI result
        if: always()
        run: cargo run --quiet -p gate-runner -- --ci-citation local
