# SCHEMAS.toml — every artifact this system persists, declared once.
#
# WHY THIS EXISTS. Eleven persisted formats were counted on 2026-08-31 and not one
# had a declared schema. Every one was invented mid-session by whoever needed it,
# and three evolved SILENTLY within that same session:
#
#   CONVERGENCE.jsonl   gained `role` an hour after creation; existing rows have no
#                       such field and the reader defaults it. A row written before
#                       the change and one written after are indistinguishable.
#   tick-monitor.tsv    gained `owner_pid`; load() defaults a missing owner to 0,
#                       which reads as "unowned" — the same value a reclaimable
#                       stale ledger has.
#   SURFACE-MAP.jsonl   had a merge-precedence bug where older rows overwrote newer
#                       ones, because rows carry no version or write order.
#
# Each was a silent widening. None broke a build. All three were caught by hand.
#
# THE RULE: an artifact this system writes MUST have a row here naming its required
# fields. `schemas.rs` validates every declared artifact that exists on disk.

[artifacts.convergence]
path      = "docs/plan/CONVERGENCE.jsonl"
format    = "jsonl"
required  = ["section", "round", "lens", "new_findings", "verdict", "gates_green"]
optional  = ["evidence", "role", "note", "pin", "void", "void_reason", "lens_limitation", "false_positives_verified", "gates_scope", "graded_by", "recorded_by", "severity"]
writer    = "grading panes"
reader    = "crates/no-shell-gate/tests/convergence.rs"
note      = "gates_green REQUIRED since 2026-09-01 (Josh: \"having not wired gates is plan issue number 1\"). convergence.rs contained ZERO references to wiring, so a round could bank a section as CONVERGED while wired_lanes was RED -- and that state existed, the wiring gate failing on a vendored serde_json under .rch-tmp/ while rounds were being graded. A clean round over a broken lane is BUILT != WIRED wearing a convergence badge. ABSENT IS TREATED AS FALSE: an unrecorded check is not a check. role added mid-session; absent means hillclimb. See AAR role taxonomy in docs/plan/12-journey.md."
pin_note  = "`pin` is the sha the round was graded against, REQUIRED from round 22 onward by HD-0005 (docs/decisions.jsonl). A round with no pin cannot be reconciled: the tree moves ~2 commits/min during a wave, so a finding recorded without a pin cites a state nobody can reconstruct, and the four round-22 rows written before this rule are void=true for exactly that reason. It is optional in this schema rather than required because rounds 8-21 predate the rule and retrofitting a pin onto them would be inventing one. The forward-looking requirement belongs in the findings-ledger gate (omp-orchestrator-hsv), which can see the round number and enforce it only where it applies. MEASURED 2026-09-01: 22 rows carried NEITHER round NOR lens while both are listed REQUIRED above, and no gate caught it -- the declaration existed and nothing read it. Those rows were per-finding resolutions misfiled into the per-round file; they now live in FINDINGS.jsonl. A required-field list that nothing enforces is documentation, not a schema."

[artifacts.surface_map]
path      = "docs/plan/SURFACE-MAP.jsonl"
format    = "jsonl"
required  = ["surface", "tool"]
optional  = ["disposition", "validated_by", "maps_to_crate", "graded_by", "batch"]
writer    = "surface-mapping panes"
reader    = "assembly + census sections"
note      = "no write-order field; a merge that does not sort newest-last silently loses newer classifications."

[artifacts.preserved_inventory]
path      = ".flywheel/inventory-artifacts/"
format    = "gzip-artifact-set"
required  = ["artifact", "content_sha256", "source", "captured_at"]
optional  = ["compressed_sha256", "source_revision", "command", "note"]
writer    = "artifact_provenance gate"
reader    = "plan provenance claims and evidence reviewers"
note      = "Preserved compressed evidence is distinct from volatile /tmp inputs. The gate must verify each declared member's content hash; a directory with no declared members is an anti-vacuity failure."

[artifacts.crate_surface]
path      = "OMP-SURFACE-MAP.toml"
format    = "toml-table"
required  = ["classification", "omp_surface", "why"]
optional  = ["negative_evidence"]
writer    = "humans and grading panes"
reader    = "crates/no-shell-gate/tests/wired_lanes.rs"
note      = "gated: every workspace crate must have a [crates.x] block and every block a crate."

[artifacts.tick_state]
path      = "~/.local/state/omp-orchestrator/sessions/<session>/tick-monitor.tsv"
format    = "tsv"
required  = ["last_tick"]
optional  = ["owner_pid", "last_blocker", "blocker_streak", "red_streak", "commit", "pane"]
writer    = "crates/tick-monitor"
reader    = "crates/tick-monitor"
note      = "session-scoped since 9356bd5; a missing owner_pid reads as 0 = reclaimable."

[artifacts.watch_ledger]
path      = "~/.local/state/omp-orchestrator/sessions/<session>/watch-ledger.jsonl"
format    = "jsonl"
required  = ["tick", "observation"]
optional  = ["stall", "no_value_streak", "free_capacity_streak", "note"]
writer    = "crates/tick-monitor watch"
reader    = "the orchestrator, by eye"
note      = "UNGATED CONSUMER: nothing parses this programmatically, so a field rename breaks nobody and is noticed by nobody."

[artifacts.grade_evidence]
path      = "/tmp/grade/r<N>-<section>.md"
format    = "markdown-sections"
required  = ["SEVERITY", "SEARCH SPACE"]
optional  = ["DEFERRED", "RETRACTED", "UNVERIFIABLE"]
writer    = "grading panes"
reader    = "the orchestrator, comparing rounds"
note      = "SEVERITY is required because a COUNT cannot distinguish a transposed digit from a refuted premise. Round 10 tagged 3 BLOCKER / 11 MAJOR / 3 MINOR; round 12 tagged nothing, so the two rounds cannot be compared and 'did the fixes help' has no answer. SEARCH SPACE is required because a zero that cannot describe what it looked at is a silence — fourteen false zeros this session. Lives in /tmp: it does not survive a reboot, which is a known and unfixed hazard."

[artifacts.beads]
path      = ".beads/issues.jsonl"
format    = "jsonl"
required  = ["id", "title", "status"]
optional  = ["priority", "assignee", "description", "closed_at", "updated_at"]
writer    = "br"
reader    = "br, bv"
note      = "OWNED UPSTREAM. Listed for completeness; we do not define this and must not widen it."

# ── UNDECLARED AND UNSTRUCTURED — named so the gap is visible ────────────────
#
# dispatch packets    plain prose typed into panes. NINETEEN waves tonight, none
#                     machine-readable, none replayable, none auditable. `ntm`
#                     ships a `dispatch` template with required objective/target
#                     variables and it was used zero times.
# grade evidence      NOW DECLARED — see [artifacts.grade_evidence]. It was listed
#                     here as undeclared and the cost landed within hours: round 12
#                     used no severity tags at all, so BLOCKER/MAJOR/MINOR counts
#                     across rounds 10 and 12 are 3/11/3 versus 0/0/0 — not an
#                     improvement, an instrument change. The question "is the plan
#                     getting better" became unanswerable.
# cooldown.json,      written by crates but never read back by a test.
# heartbeat.jsonl,
# tick-ledger.jsonl,
# omp-build-registration.json

[artifacts.journey_foundation]
path      = "docs/plan/FOUNDATION.jsonl"
format    = "jsonl"
required  = ["schema_version", "stage", "input_refs", "output_refs", "owner", "crates", "gates", "numbers", "known", "unknown", "gaps"]
optional  = ["evidence", "status", "source"]
writer    = "journey foundation panes"
reader    = "plan materializer and stage gates"
note      = "One row per stage. Every KNOWN has a command/result or a NUMBERS.toml key; every UNKNOWN has an owner, resolving experiment, and cost; every GAP has a cost if left open. No blank epistemic cells."

[artifacts.dispatch_journal]
path      = "docs/plan/DISPATCH.jsonl"
format    = "jsonl"
required  = ["ts", "wave", "bead", "targets", "transport", "claim_id", "receipt", "journal_seq"]
optional  = ["refusals", "fan_in_verdict"]
writer    = "S5 dispatch path (unbuilt — the wire is the work, 12-journey S5 F3)"
reader    = "S6 grading (packet/receipt pair), reap path (silence detection), post-mortems"
note      = "append-only; declared 2026-09-01 by 12-journey S5 F1. Zero rows today: the stage has not run. The file is created by the first journaled dispatch."

[artifacts.human_decisions]
path      = "docs/decisions.jsonl"
format    = "jsonl"
required  = ["id", "ts", "question", "decider", "decision", "options_considered", "binds_stages", "supersedes", "review_after", "recorded_by"]
optional  = ["transcript_ref", "promoted_to"]
writer    = "S9 mechanism (unbuilt — adequate substrate until it exists: bead comments in the same shape)"
reader    = "dispatch packet builder (binds_stages), AGENTS.md amortization pass, grading pane (unfalsifiable Josh-said refusal)"
note      = "declared 2026-09-01 by 12-journey S9 F1. The ledger currently contains 3 manually recorded HD rows; the automated writer, lifecycle-event linkage, and amortization consumer remain unbuilt."

[artifacts.findings_ledger]
path      = "docs/plan/FINDINGS.jsonl"
format    = "jsonl"
required  = ["id", "round", "section", "graded_by", "severity", "finding", "disposition"]
optional  = ["fixed_in", "retracted_reason", "deferred_to", "evidence", "dispositioned_by", "dispositioned_at"]
writer    = "reconciliation panes (rounds 15-21), then every grading pane from round 22 on"
reader    = "crates/no-shell-gate/tests/findings_ledger.rs (unbuilt at declaration) and the integrator before cutting a pin"
note      = "Declared 2026-09-01 by HD-0006 (Josh: no new rounds until ALL fixes from rounds 15-22 are in the plan properly). One row per DECLARED finding: id is the grader's finding id where one exists (R19-00-section-map-omits-11-12) or <round>-<section>-<eye>-<n> where the eye recorded only a count. disposition is FIXED (fixed_in = commit sha), RETRACTED (retracted_reason, dispositioned_by), or DEFERRED (deferred_to = bead id); OPEN is the initial state and any OPEN row refuses the next round. Anti-vacuity: a ledger with fewer rows than the sum of new_findings across the reconciled round files is an ERROR, not a pass."

[artifacts.inception_manifest]
path      = ".omp-orchestrator/inception.json"
format    = "json"
required  = ["schema_version", "project_id", "repo_identity", "control_files", "host_capabilities", "required_tools", "trust_status"]
optional  = ["evidence", "status", "degradations"]
writer    = "S1 inception foundation"
reader    = "S2 planning foundation and S7 validation"
note      = "The manifest is the durable S1 boundary. Missing, ambiguous, or stale identity/capability fields refuse the next stage before any bead exists."

[artifacts.numbers]
path      = "NUMBERS.toml"
format    = "toml-tables"
required  = ["command", "expect", "appears"]
optional  = ["note"]
writer    = "journey foundation and figure owners"
reader    = "numbers.rs and every load-bearing plan claim"
note      = "Every numeric claim has one runnable command and expectation; LIVE figures use an explicit live boundary. Duplicate figure keys are refused by the registry gate."
