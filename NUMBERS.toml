# -- BLOCKER RESOLUTIONS, round 13. Three graders independently flagged one
# property carrying multiple live denominators. Every number was TRUE; none was
# declared authoritative, so a reader could not tell which to quote. Registering
# the authoritative reading is the fix -- deleting the others would erase real
# information about where the lint lives.

[figures.forbid_unsafe_authoritative]
command  = "u=0; for d in crates/*/; do if grep -q 'unsafe_code = \"forbid\"' \"$d/Cargo.toml\" 2>/dev/null || grep -rq 'forbid\\(unsafe_code\\)' \"$d\" --include='*.rs' 2>/dev/null; then u=$((u+1)); fi; done; echo $u"
expect   = "LIVE"
note     = "AUTHORITATIVE union command; the current result is intentionally not frozen in prose because workspace membership moves. The manifest-only, source-attribute, and both-mechanisms commands carry the component split. Earlier 16/22, 20/26, 25/26, and 26/26 values are dated historical snapshots."

[figures.control_plane_unextracted_loc]
command  = "tot=0; for c in fleet-truth oracle-compare oracle-pane-state-differential ntm-fleet-monitor fleet-monitor loop-driver fast-dispatch omp-idle-dispatch pane-dispatch-ready loop-tick fleet-reconcile wired-but-inert-guard verify-dispatch pane-truth reap-finished-panes tick-dispatch loop-coverage dispatcher-deadman refill-idle-panes pane-oracle-diff; do s=/Users/josh/Developer/control-plane/crates/$c; if [ -d $s ] && [ ! -d crates/$c ]; then tot=$((tot+$(find $s -name '*.rs' -type f -exec cat {} + 2>/dev/null | wc -l))); fi; done; echo $tot"
expect   = "0"
zero_is_real = true

note     = "Current unextracted LOC is zero when each upstream crate has a corresponding crates/$c directory; the previous 29,512 total was the source corpus, not an unextracted count."
[figures.ipg6_root_symbols]
command  = "R=/Users/josh/.local/lib/node_modules/@oh-my-pi/pi-coding-agent/dist/types; tot=0; for r in eval if-bench hindsight debug dap autoresearch autolearn advisor; do [ -d \"$R/$r\" ] && tot=$((tot+$(grep -rhoE '^export (declare )?(type|interface|const|function|class|enum) [A-Za-z_]+' \"$R/$r\" --include='*.d.ts' 2>/dev/null | wc -l))); done; echo $tot"
expect   = "621"
note     = "The ipg.6 eight-root symbol total, with the counting rule DECLARED: top-level `export [declare] {type,interface,const,function,class,enum} NAME` in *.d.ts. 12-journey previously carried 533 in prose against a table summing to 503, and this command answers 621 -- THREE numbers, none of which shipped a derivation, so none was falsifiable. The gap is concentrated: `eval` alone is 207 here against the table's 95. Registering the rule does not make 621 more true than 533; it makes it CHECKABLE, which the other two never were."

[figures.spawning_crates]
command  = "n=0; for d in crates/*/; do c=$(find \"$d/src\" -name '*.rs' -type f -exec grep -c 'Command::new' {} + 2>/dev/null | awk -F: '{s+=$NF} END{print s+0}'); [ \"${c:-0}\" -gt 0 ] && n=$((n+1)); done; echo $n"
expect   = "35"
note     = "Crates spawning a child process from src/ (production paths only; tests/ excluded because a lint's known-bad specimens must spawn raw to be detectable). 5 declare subprocess-contract; the other 10 carry named allowance rows in spawn_contract.rs, 6 of them marked PROVISIONAL as debt rather than as decisions. My first hand-measurement of this said 12 crates -- it swept tests/ AND I truncated the list with head -12. The gate is the better instrument."

[figures.help_discoverable_binaries]
command  = "R=/Volumes/BuildShared/cargo-targets/release; n=0; for b in $(~/.cargo/bin/cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c \"import sys,json;m=json.load(sys.stdin);print(' '.join(sorted(t['name'] for p in m['packages'] for t in p['targets'] if 'bin' in t['kind'])))\"); do [ -x \"$R/$b\" ] || continue; o=$(timeout 15 \"$R/$b\" --help 2>&1 | head -1); case \"$o\" in usage*) case \"$o\" in *unknown*|*error*) ;; *) n=$((n+1));; esac;; esac; done; echo $n"
expect   = "10"
note     = "Bin targets whose --help FIRST LINE is a usage line carrying no error. NOTE, and it is the point: a stricter classifier that scans the WHOLE output rather than the first line answers 6, not 7 -- one binary opens with a clean usage line and errors further down. Two instruments, two answers; the REGISTERED COMMAND is the authority, per this repo's own rule that every number carries the command that derives it. The prose in 07-installability 7.10 quotes the stricter 6 and now says so. Measured 2026-09-01 across all 23 bin targets: 7 NOT-BUILT, 6 REAL-HELP, 3 REJECTS --help as an unknown argument, 3 treat --help as a FILESYSTEM PATH, 2 SILENT, 1 EXECUTES the gate when asked for help, 1 errors on an unrelated precondition. Only 1 of 16 buildable binaries names a timeout or deadline in its own help. This is the invocation half of Josh's 'mapped to specific commands with proper guards and timeouts' objective; the ADDRESSABLE half (does anything TELL an operator the binary exists) is satisfied by zero of eight gates."
