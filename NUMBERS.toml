# NUMBERS.toml — load-bearing figures in the plan, each with the command that derives it.
#
# WHY. Five grading rounds have now produced the same defect class, and round 10's
# fresh-eyes pass produced almost nothing else: a number that was CORRECT WHEN
# WRITTEN and is wrong now, because the repo moved under it.
#
#   00-brief   board headline sums to 74 not 75, AND is live-stale (30/23/23/3 now)
#   00-brief   unsafe figures stated 20/19; manifest says 26/26, attributes 25/26
#   00-brief   R12 says "ten questions" over twelve rows
#   01-idea    379 vs 370 vs 402 test counts, three values one quantity
#   02-census  three unreconciled final-table snapshots: 101, 121, live 129
#   07-install "18 binaries" from `grep fn main`; cargo says 21
#
# §00 already demands "every number carries the command that derives it". That is a
# rule with no enforcement, so the numbers rot silently between rounds and a human
# has to notice. Grading cannot keep up with drift — the interval between rounds is
# hours and the drift is continuous.
#
# THE RULE: a load-bearing figure gets a row here. `numbers.rs` RE-RUNS the command
# and fails when the answer no longer matches. A number without a runnable command
# is not measured, it is remembered.

[figures.workspace_crates]
command  = "ls -1 crates | wc -l"
expect   = "27"
appears  = ["docs/plan/03-crates.md", "AGENTS.md"]
note     = "was 20 at inception, then 23, now 26. Cited in four documents."

[figures.built_binaries]
command  = "cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c \"import sys,json;m=json.load(sys.stdin);print(len([t for p in m['packages'] for t in p['targets'] if 'bin' in t['kind']]))\""
expect   = "23"
appears  = ["docs/plan/07-installability.md"]
note     = "cargo metadata, NOT cargo build: build emits artifacts only for crates it actually recompiles, so an up-to-date workspace answers 0. The gate caught that on its first run. This is the instrument that answers 'binaries the workspace builds'. grep fn main says 18 (re-measured 2026-09-01), [[bin]] says 16."

[figures.crates_forbidding_unsafe]
command  = "grep -l 'unsafe_code' crates/*/Cargo.toml | wc -l"
expect   = "27"
appears  = ["docs/plan/00-brief.md", "AGENTS.md"]
note     = "AGENTS.md still says 2 of 20. Round 10 found 20/19 stated against 26/26 measured."

[figures.installer_known_binaries]
command  = "grep -o '\"[a-z-]*\"' crates/installer/src/main.rs | head -3 | wc -l"
expect   = "3"
appears  = ["docs/plan/07-installability.md"]
note     = "3 of 21 = 14% install coverage."

[figures.surface_map_rows]
command  = "grep -c . docs/plan/SURFACE-MAP.jsonl"
expect   = "591"
appears  = ["docs/plan/02-surface-census.md", "docs/PLAN.md"]
note     = "round 10 found THREE unreconciled snapshots of this: 101, 121, and live."

[figures.plan_sections]
command  = "ls -1 docs/plan/[0-9][0-9]-*.md | wc -l"
expect   = "13"
appears  = ["docs/PLAN.md", "docs/plan/CONVERGENCE.md"]
note     = "12 analysis sections + 12-journey. The convergence gate hardcodes 12 SECTIONS and does NOT include 12-journey — deliberate, and it is why this figure is 13 while that list is 12."

# ── The high-drift figures round 10 named. Added by the orchestrator, leading by
#    example on the instruction given to the fix round: declaring one is worth more
#    than correcting one, because a correction lasts until the next commit.
[figures.test_files]
command  = "for d in crates/*/tests; do ls $d/*.rs 2>/dev/null; done | wc -l"
expect   = "47"
appears  = ["docs/plan/00-brief.md", "docs/plan/01-idea.md", "docs/plan/06-gates.md"]
note     = "was 26 when the brief measured it, 30 by round 10, 31 at the round-11 fix — five meta-gate test files landed during grading. 01-idea's 370/379 and 06-gates' transcribed copies all drift from this one quantity."

[figures.board_total]
command  = "for s in closed in_progress open blocked; do br list --status $s | grep -c .; done | python3 -c 'import sys;print(sum(int(l) for l in sys.stdin))'"
expect   = "LIVE"
appears  = ["docs/plan/00-brief.md", "docs/plan/09-milestones.md"]
note     = "not a fixed figure — the board moves hourly. Declared so any prose quoting a board total without 'as of' + command is measurable drift. Snapshot quotes must carry their timestamp. (The orchestrator also added a refutation_count row; if it was lost in a concurrent edit, the prose rule stands: name the §7 table as the source, never a bare count.)"

[figures.test_functions]
command  = "grep -rhc '#\\[test\\]' crates/*/src/*.rs crates/*/tests/*.rs 2>/dev/null | awk '{s+=$1} END{print s}'"
expect   = "489"
appears  = ["docs/plan/01-idea.md", "docs/plan/06-gates.md", "docs/plan/00-brief.md"]
note     = "THE WORST OFFENDER, and it drifted WHILE THIS ROW WAS BEING WRITTEN. Three live values for one quantity — 370, 379, 402 — found in one round, in three sections. Measured 406, and by the time the parser was fixed it was 407, because writing the unescaper test added five functions. The gate caught drift caused by the commit that created it. Corrected by hand four times tonight and drifted again each time, because every new crate adds tests."

[figures.no_claim_blocks]
command  = "grep -rc '^\\*\\*NO-CLAIM' docs/plan/*.md 2>/dev/null | awk -F: '{s+=$2} END{print s}'"
expect   = "49"
appears  = ["docs/PLAN.md"]
note     = "the header quantifies the plan's own hedging; it is generated at assembly but never checked against the sections after they are edited."

[figures.surface_engaged_pct]
command  = "python3 -c \"import json;r=[json.loads(l) for l in open('docs/plan/SURFACE-MAP.jsonl') if l.strip()];e=sum(1 for x in r if x.get('disposition') in ('CONSUMED','WIRE','VALIDATE'));print(f'{100*e/len(r):.1f}')\""
expect   = "21.8"
appears  = ["docs/PLAN.md", "docs/plan/02-surface-census.md"]
note     = "published as 6.2% first, then 17.1%, then 21.8%. Round 10 found THREE unreconciled snapshots of the table this derives from."

[figures.convergence_rows]
command  = "grep -c . docs/plan/CONVERGENCE.jsonl"
expect   = "70"
appears  = ["docs/plan/CONVERGENCE.md"]
note     = "3 rounds x 12 sections. A round that reports 11 rows is a pane that silently dropped a section, which has happened twice."

[figures.unsafe_both_mechanisms]
command  = "python3 -c \"import pathlib,re;m=[re.search(r'unsafe_code\\s*=\\s*.forbid.',p.read_text()) for p in pathlib.Path('crates').glob('*/Cargo.toml')];i=[any(re.search(r'^#!\\[forbid\\(unsafe_code\\)\\]',x.read_text(errors='ignore'),re.M) for x in p.parent.glob('src/**/*.rs')) for p in pathlib.Path('crates').glob('*/Cargo.toml')];print(sum(1 for a,b in zip(m,i) if a and b))\""
expect   = "26"
appears  = ["docs/plan/03-crates.md"]
note     = "the both-mechanisms count moved 19 -> 25 in one round when six crates adopted the manifest lint. The triple (manifest/both/attribute-only) is the highest-rotation statistic in the plan; both-mechanisms is the one the gate text depends on."

[figures.cargo_manifest_dir_sites]
command  = "python3 -c \"import pathlib;print(sum(p.read_text(errors='ignore').count('CARGO_MANIFEST_DIR') for p in pathlib.Path('crates').rglob('*.rs')))\""
expect   = "LIVE"
appears  = ["docs/plan/08-end-users.md"]
note     = "moves with every landed test file (tests cite CARGO_MANIFEST_DIR for fixture paths); LIVE mode requires the command to run and produce output, and obliges the prose to cite the command rather than a frozen count."
[figures.surface_map_unmapped_rows]
command  = "jq -s '[.[] | select(.maps_to_crate == null)] | length' docs/plan/SURFACE-MAP.jsonl"
expect   = "478"
appears  = ["docs/plan/02-surface-census.md"]
note     = "maps_to_crate == null is the explicit unmapped-by-crate metric; it is distinct from non-null validated_by and from missing rows."

# ── EXTRACTION DEBT. Declared because 03-crates §3.9 claims this registry carries
#    it, and a doc claiming a gate exists when it does not is the unearned field
#    this file was built to prevent.

[figures.unextracted_crates]
command  = "python3 -c \"import re,pathlib;t=pathlib.Path('AGENTS.md').read_text();rows=re.findall(r'\\|\\s*.([a-z][a-z0-9-]+).\\s*\\|\\s*\\*\\*CONTROL-PLANE\\*\\*',t);here={p.name for p in pathlib.Path('crates').iterdir() if p.is_dir()};print(len([n for n in rows if n not in here]))\""
expect   = "20"
appears  = ["docs/plan/03-crates.md", "AGENTS.md"]
note     = "20 of 20 marked CONTROL-PLANE are still upstream; ZERO extracted. Every crate in this workspace is new session work, not an extraction landing. This figure goes DOWN as bead -815 proceeds and must never silently go up."

[figures.workspace_crates_on_disk]
command  = "ls -1 crates | wc -l"
expect   = "27"
appears  = ["docs/plan/03-crates.md", "AGENTS.md", "docs/PLAN.md"]
note     = "duplicate of workspace_crates by design: 03-crates §3.9 reasons about the RELATIONSHIP between this and unextracted_crates, so both must be pinned or the ratio silently rots."

# -- BLOCKER RESOLUTIONS, round 13. Three graders independently flagged one
# property carrying multiple live denominators. Every number was TRUE; none was
# declared authoritative, so a reader could not tell which to quote. Registering
# the authoritative reading is the fix -- deleting the others would erase real
# information about where the lint lives.

[figures.forbid_unsafe_authoritative]
command  = "u=0; for d in crates/*/; do if grep -q 'unsafe_code = \"forbid\"' \"$d/Cargo.toml\" 2>/dev/null || grep -rq 'forbid\\(unsafe_code\\)' \"$d\" --include='*.rs' 2>/dev/null; then u=$((u+1)); fi; done; echo $u"
expect   = "27"
note     = "AUTHORITATIVE for 'does this workspace forbid unsafe': the UNION of manifest lint and source-root attribute. 26 of 26. The manifest-only reading is also 26; the source-root-only reading is 25 (one crate carries the lint in its manifest alone). 06-gates cites 16/22 from the brief and 20/26 from an earlier draft -- both are stale, measured before six crates adopted the lint."

[figures.control_plane_unextracted_loc]
command  = "tot=0; for c in fleet-truth oracle-compare oracle-pane-state-differential ntm-fleet-monitor fleet-monitor loop-driver fast-dispatch omp-idle-dispatch pane-dispatch-ready loop-tick fleet-reconcile wired-but-inert-guard verify-dispatch pane-truth reap-finished-panes tick-dispatch loop-coverage dispatcher-deadman refill-idle-panes pane-oracle-diff; do d=/Users/josh/Developer/control-plane/crates/$c; [ -d \"$d\" ] && tot=$((tot+$(find \"$d\" -name '*.rs' -type f -exec cat {} + 2>/dev/null | wc -l))); done; echo $tot"
expect   = "29512"
note     = "AUTHORITATIVE extraction debt: 29,512 LOC across exactly 20 named crates, measured by walking the source. The 28,779 figure in 03-crates is AGENTS.md's own table SUM, which is stale by 733 lines. A hand-maintained table summed against a live walk is the defect; the walk wins."

[figures.ipg6_root_symbols]
command  = "R=/Users/josh/.local/lib/node_modules/@oh-my-pi/pi-coding-agent/dist/types; tot=0; for r in eval if-bench hindsight debug dap autoresearch autolearn advisor; do [ -d \"$R/$r\" ] && tot=$((tot+$(grep -rhoE '^export (declare )?(type|interface|const|function|class|enum) [A-Za-z_]+' \"$R/$r\" --include='*.d.ts' 2>/dev/null | wc -l))); done; echo $tot"
expect   = "621"
note     = "The ipg.6 eight-root symbol total, with the counting rule DECLARED: top-level `export [declare] {type,interface,const,function,class,enum} NAME` in *.d.ts. 12-journey previously carried 533 in prose against a table summing to 503, and this command answers 621 -- THREE numbers, none of which shipped a derivation, so none was falsifiable. The gap is concentrated: `eval` alone is 207 here against the table's 95. Registering the rule does not make 621 more true than 533; it makes it CHECKABLE, which the other two never were."

[figures.spawning_crates]
command  = "n=0; for d in crates/*/; do c=$(find \"$d/src\" -name '*.rs' -type f -exec grep -c 'Command::new' {} + 2>/dev/null | awk -F: '{s+=$NF} END{print s+0}'); [ \"${c:-0}\" -gt 0 ] && n=$((n+1)); done; echo $n"
expect   = "16"
note     = "Crates spawning a child process from src/ (production paths only; tests/ excluded because a lint's known-bad specimens must spawn raw to be detectable). 5 declare subprocess-contract; the other 10 carry named allowance rows in spawn_contract.rs, 6 of them marked PROVISIONAL as debt rather than as decisions. My first hand-measurement of this said 12 crates -- it swept tests/ AND I truncated the list with head -12. The gate is the better instrument."

[figures.help_discoverable_binaries]
command  = "R=/Volumes/BuildShared/cargo-targets/release; n=0; for b in $(~/.cargo/bin/cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c \"import sys,json;m=json.load(sys.stdin);print(' '.join(sorted(t['name'] for p in m['packages'] for t in p['targets'] if 'bin' in t['kind'])))\"); do [ -x \"$R/$b\" ] || continue; o=$(timeout 15 \"$R/$b\" --help 2>&1 | head -1); case \"$o\" in usage*) case \"$o\" in *unknown*|*error*) ;; *) n=$((n+1));; esac;; esac; done; echo $n"
expect   = "7"
note     = "Bin targets whose --help FIRST LINE is a usage line carrying no error. NOTE, and it is the point: a stricter classifier that scans the WHOLE output rather than the first line answers 6, not 7 -- one binary opens with a clean usage line and errors further down. Two instruments, two answers; the REGISTERED COMMAND is the authority, per this repo's own rule that every number carries the command that derives it. The prose in 07-installability 7.10 quotes the stricter 6 and now says so. Measured 2026-09-01 across all 23 bin targets: 7 NOT-BUILT, 6 REAL-HELP, 3 REJECTS --help as an unknown argument, 3 treat --help as a FILESYSTEM PATH, 2 SILENT, 1 EXECUTES the gate when asked for help, 1 errors on an unrelated precondition. Only 1 of 16 buildable binaries names a timeout or deadline in its own help. This is the invocation half of Josh's 'mapped to specific commands with proper guards and timeouts' objective; the ADDRESSABLE half (does anything TELL an operator the binary exists) is satisfied by zero of eight gates."
