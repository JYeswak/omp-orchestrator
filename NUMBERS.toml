# NUMBERS.toml — load-bearing figures in the plan, each with the command that derives it.
#
# WHY. Five grading rounds have now produced the same defect class, and round 10's
# fresh-eyes pass produced almost nothing else: a number that was CORRECT WHEN
# WRITTEN and is wrong now, because the repo moved under it.
#
#   00-brief   board headline sums to 74 not 75, AND is live-stale (30/23/23/3 now)
#   00-brief   unsafe figures stated 20/19; manifest says 26/26, attributes 25/26
#   00-brief   R12/R13 register thirteen questions across thirteen sections
#   01-idea    379 vs 370 vs 402 test counts, three values one quantity
#   02-census  three unreconciled final-table snapshots: 101, 121, live 129
#   07-install "18 binaries" from `grep fn main`; cargo says 21
#
# §00 already demands "every number carries the command that derives it". That is a
# rule with no enforcement, so the numbers rot silently between rounds and a human
# has to notice. Grading cannot keep up with drift — the interval between rounds is
# hours and the drift is continuous.
#
# THE RULE: a load-bearing figure gets a row here. `numbers.rs` RE-RUNS the command
# and fails when the answer no longer matches. A number without a runnable command
# is not measured, it is remembered.

[figures.workspace_crates]
command  = "ls -1 crates | wc -l"
expect   = "LIVE"
appears  = ["docs/plan/00-brief.md", "docs/plan/01-idea.md", "docs/plan/02-surface-census.md", "docs/plan/03-crates.md", "AGENTS.md"]

note     = "LIVE current workspace crate count from the exact command; 20/23/26 are dated historical snapshots."
[figures.built_binaries]
command  = "cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c \"import sys,json;m=json.load(sys.stdin);print(len([t for p in m['packages'] for t in p['targets'] if 'bin' in t['kind']]))\""
expect   = "LIVE"
appears  = ["docs/plan/00-brief.md", "docs/plan/02-surface-census.md", "docs/plan/07-installability.md"]
note     = "cargo metadata, NOT cargo build: build emits artifacts only for crates it actually recompiles, so an up-to-date workspace answers 0. The gate caught that on its first run. This is the instrument that answers 'binaries the workspace builds'; its current result is LIVE, while grep fn main and [[bin]] are separate, non-authoritative inventories."

[figures.crates_forbidding_unsafe]
