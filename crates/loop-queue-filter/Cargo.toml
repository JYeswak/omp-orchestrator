[package]
license.workspace = true
name = "loop-queue-filter"
version = "0.1.0"
edition = "2021"
description = "Fail-closed Rust port of the control-plane dispatch queue selector."

[[bin]]
name = "loop-queue-filter"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
blocker-taxonomy = { path = "../blocker-taxonomy" }


[dev-dependencies]
path-literal-guard = { path = "../path-literal-guard" }

[lints.rust]
unsafe_code = "forbid"
