[package]
license.workspace = true
name = "lifecycle-event"
version = "0.1.0"
edition = "2021"
publish = false
description = "S1 LifecycleEvent writer: typed row, durable JSONL, readback-enforced emit"

[[bin]]
name = "lifecycle-event"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["cx"]
cx = ["dep:asupersync"]

[dependencies]
asupersync = { workspace = true, optional = true }
omp-types = { path = "../omp-types" }
serde_json = "1"

[dev-dependencies]
asupersync = { workspace = true }
tempfile = "3"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
