[package]
license.workspace = true
name = "pre-delete-citation-check"
version = "0.1.0"
edition = "2021"
description = "Refuses deleting a file that any closed bead cites as evidence"

[[bin]]
name = "pre-delete-citation-check"
path = "src/main.rs"

[dependencies]
ack-spine = { path = "../ack-spine" }
serde_json = "1"
finding = { path = "../finding" }
subprocess-contract = { path = "../subprocess-contract" }
omp-types = { path = "../omp-types" }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
checks = [["{repo}"]]
