[package]
license.workspace = true
name = "loop-tick"
version = "0.1.0"
edition = "2021"
description = "Single-pane control-plane dispatch tick; shell helpers remain external boundaries."


[[bin]]
name = "loop-tick"
path = "src/main.rs"

[lib]
name = "loop_tick"
path = "src/lib.rs"

[dependencies]
subprocess-contract = { path = "../subprocess-contract" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
