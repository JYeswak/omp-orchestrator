[package]
name = "cargo-lane-budget"
version = "0.1.0"
edition = "2021"
description = "Fail-closed Cargo lane population and APFS container admission gate."

[[bin]]
name = "cargo-lane-budget"
path = "src/main.rs"

[lib]
name = "cargo_lane_budget"
path = "src/lib.rs"

[dependencies]
subprocess-contract = { path = "../subprocess-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
