[package]
name = "bead-holder"
version = "0.1.0"
edition = "2021"
publish = false
description = "Answer which agent holds a bead and whether that pane is alive, from evidence"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "bead_holder"
path = "src/lib.rs"

[[bin]]
name = "bead-holder"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[build-dependencies]
build-stamp = { path = "../build-stamp" }
