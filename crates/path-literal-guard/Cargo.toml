[package]
license.workspace = true
name = "path-literal-guard"
version = "0.1.0"
edition = "2021"
description = "Home-path-literal gate over crates/*/src, in two named modes: repo-wide sweep and staged-set scope"

[lib]
name = "path_literal_guard"
path = "src/lib.rs"

[[bin]]
name = "path-literal-guard"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
[package.metadata.gate]
# 3xpf0: the bin's --repo-wide mode is a side-effect-free check (exit 0
# clean / 1 violation / 2 usage / 3 nothing / 4 vacuous), so gate-runner can
# execute it. Moves path-literal-guard from workflow-only (dead without a
# remote) to runner-discovered, same shape as fleet-composite 8cfeac1.
checks = [["--repo-wide", "{repo}"]]

[build-dependencies]
build-stamp = { path = "../build-stamp" }
