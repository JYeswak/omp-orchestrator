[package]
license.workspace = true
name = "omp-rpc-session"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typed, bounded single-session adapter for OMP --mode=rpc"

[lib]
name = "omp_rpc_session"
path = "src/lib.rs"

[[bin]]
name = "omp-rpc-session"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
serde_json = "1"

[package.metadata.gate]
# Cell 2 runtime gate: execute the state-only RPC path against the configured OMP binary.
# The default request set remains the complete four-method sequence; --state is explicit.
checks = [{ bin = "omp-rpc-session", args = ["quick", "--state"] }]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
