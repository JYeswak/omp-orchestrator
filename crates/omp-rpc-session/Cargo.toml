[package]
license.workspace = true
name = "omp-rpc-session"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typed, bounded single-session adapter for OMP --mode=rpc"

[lib]
name = "omp_rpc_session"
path = "src/lib.rs"

[[bin]]
name = "omp-rpc-session"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
