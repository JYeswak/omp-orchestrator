[package]
license.workspace = true
name = "kernel-only-operator-hook"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed PreToolUse hook that blocks operator kernel bypasses"

[[bin]]
name = "kernel-only-operator-hook"
path = "src/main.rs"

[lib]
name = "kernel_only_operator_hook"
path = "src/lib.rs"

[dependencies]
asupersync = { workspace = true }
subprocess-contract = { path = "../subprocess-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lifecycle-event = { path = "../lifecycle-event" }
[lints.rust]
unsafe_code = "forbid"
