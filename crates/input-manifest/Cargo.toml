[package]
name = "input-manifest"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
description = "Typed full, partial, and refused input coverage for instrument results"

[lib]
name = "input_manifest"
path = "src/lib.rs"

[[bin]]
name = "input-manifest"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[build-dependencies]
build-stamp = { path = "../build-stamp" }
