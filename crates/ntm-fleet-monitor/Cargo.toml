[package]
license.workspace = true
name = "ntm-fleet-monitor"
version = "0.1.0"
edition = "2021"
description = "Typed fleet-loop actions and approval/non-approval waves. Classifies; does not send."

[lib]
name = "ntm_fleet_monitor"
path = "src/lib.rs"

[[bin]]
name = "ntm-fleet-monitor"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
loop-coverage = { path = "../loop-coverage" }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
