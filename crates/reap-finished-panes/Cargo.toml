[package]
license.workspace = true
name = "reap-finished-panes"
version = "0.1.0"
edition = "2021"
description = "Sweep finished worker panes with a Rust-owned settle, readiness, and durable-capture path."

[[bin]]
name = "reap-finished-panes"
path = "src/main.rs"

[lib]
name = "reap_finished_panes"
path = "src/lib.rs"

[dependencies]
fs2 = "0.4"
pane-dispatch-ready = { path = "../pane-dispatch-ready" }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }
tick-monitor = { path = "../tick-monitor" }

# The supervisor that INVOKES this binary. A dev-dependency only: the parity
# test asks omp-orchestrator for the exact argument list it sends and spawns
# this crate's bin with it, so caller/callee drift reddens instead of going
# latent. Not a runtime dependency -- the reaper is invoked over PATH.
[dev-dependencies]
omp-orchestrator = { path = "../omp-orchestrator" }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
