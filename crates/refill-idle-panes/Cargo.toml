[package]
name = "refill-idle-panes"
version = "0.1.0"
edition = "2021"
description = "Refill every idle pane from the bv DAG. Port of bin/refill-idle-panes.sh; the shell file remains the differential oracle."

[[bin]]
name = "refill-idle-panes"
path = "src/main.rs"

[lib]
name = "refill_idle_panes"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
