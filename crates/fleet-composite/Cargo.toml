
[package]
name = "fleet-composite"
version = "0.1.0"
edition = "2021"
description = "Geometric fleet health composite and diagnostic CLI"

[lib]
name = "fleet_composite"
path = "src/lib.rs"

[[bin]]
name = "fleet-composite"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
