[package]
license.workspace = true
name = "undrained-pipe-lint"
version = "0.1.0"
edition = "2021"
description = "Fails on the undrained-pipe deadlock pattern: both pipes piped + try_wait poll + no concurrent drain"

[[bin]]
name = "undrained-pipe-lint"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
checks = [["{repo}"]]
