[package]
license.workspace = true
name = "porting-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed gate for wired, declared, conformance-checked crate arrivals"

[[bin]]
name = "porting-gate"
path = "src/main.rs"

[lib]
name = "porting_gate"
path = "src/lib.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
checks = [["--repo", "{repo}", "--crate", "porting-gate"]]

[build-dependencies]
build-stamp = { path = "../build-stamp" }
