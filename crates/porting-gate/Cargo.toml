[package]
license.workspace = true
name = "porting-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed gate for wired, declared, conformance-checked crate arrivals"

[[bin]]
name = "porting-gate"
path = "src/main.rs"

[lib]
name = "porting_gate"
path = "src/lib.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"
