[package]
license.workspace = true
name = "commit-build-fence"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed pre-commit fence for registered in-flight builds"

[[bin]]
name = "commit-build-fence"
path = "src/main.rs"

[lib]
name = "commit_build_fence"
path = "src/lib.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
# HAZARD 1 (omp-orchestrator-etyur, %6's ruling): `init` MUTATES -- it writes
# git_dir(repo)/omp-build-registration.json -- so it is SETUP, not a check, and
# it is NOT declared here. A gate that mutates the tree it gates cannot
# distinguish "already conformant" from "I made it conformant": both produce
# the same green. `init` stays available as a binary subcommand for explicit
# store creation; the check pass must never invoke it.
# omp-orchestrator-3lf36, option (b): `check` needs no setup. A missing store
# at the derived default path is a defined Clear verdict
# (COMMIT_FENCE_CLEAR reason=no_registration_store), so the single declared
# phase plans Execute instead of SkipDependent. A missing store at an explicit
# --store path still refuses; see src/main.rs run_check.
checks = [
    { bin = "commit-build-fence", args = ["check", "--repo", "{repo}"] },
]

[build-dependencies]
build-stamp = { path = "../build-stamp" }
