[package]
license.workspace = true
name = "commit-build-fence"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed pre-commit fence for registered in-flight builds"

[[bin]]
name = "commit-build-fence"
path = "src/main.rs"

[lib]
name = "commit_build_fence"
path = "src/lib.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
# HAZARD 1 (omp-orchestrator-etyur, %6's ruling): `init` MUTATES -- it writes
# git_dir(repo)/omp-build-registration.json (src/main.rs:279) -- so it is SETUP, not a
# check, and it must SAY SO. A gate that mutates the tree it gates cannot distinguish
# "already conformant" from "I made it conformant": both produce the same green.
# Declaring it requires the table form, which is deliberate -- setup is declared, never
# inferred from position.
checks = [
    { bin = "commit-build-fence", args = ["init", "--repo", "{repo}"], setup = true },
    { bin = "commit-build-fence", args = ["check", "--repo", "{repo}"] },
]

[build-dependencies]
build-stamp = { path = "../build-stamp" }
