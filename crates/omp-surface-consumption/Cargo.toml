[package]
name = "omp-surface-consumption"
version = "0.1.0"
edition = "2021"
publish = false
description = "Derive OMP's inbound RPC command set from the installed bundle and map each method to the crate that consumes it"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "omp_surface_consumption"
path = "src/lib.rs"

[[bin]]
name = "omp-surface-consumption"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
subprocess-contract = { path = "../subprocess-contract" }
serde_json = "1"

[package.metadata.gate]
# Run the existing scanner through gate-runner as an explicit zero-argument phase.
checks = [{ bin = "omp-surface-consumption", args = [], takes_no_args = true }]

# These declarations have real opt-in callsites in src/main.rs::run_cli_probe.
# models is declared without a new user-facing verb because its ids duplicate get_available_models.
[package.metadata.omp_surface]
consumes = [
    { kind = "cli", name = "models", call_site = "src/main.rs::run_cli_probe" },
    { kind = "cli", name = "stats", call_site = "src/main.rs::run_cli_probe" },
    { kind = "cli", name = "usage", call_site = "src/main.rs::run_cli_probe" },
    { kind = "rpc_notification", name = "tool_stream_update", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_notification", name = "message_update", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_notification", name = "message_start", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_notification", name = "message_end", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_notification", name = "turn_end", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_notification", name = "agent_end", call_site = "src/main.rs::run_rpc_event_probe" },
    { kind = "rpc_handler", name = "negotiate_protocol", call_site = "src/rpc_probe.rs" },
]

[build-dependencies]
build-stamp = { path = "../build-stamp" }
