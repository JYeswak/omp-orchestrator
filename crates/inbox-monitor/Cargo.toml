[package]
license.workspace = true
name = "inbox-monitor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Turn an arrived Agent Mail message into a loud typed outcome an operator must answer"

[[bin]]
name = "inbox-monitor"
path = "src/main.rs"

[lib]
name = "inbox_monitor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }
tick-monitor = { path = "../tick-monitor" }
agent-mail-native = { path = "../agent-mail-native" }
asupersync = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
