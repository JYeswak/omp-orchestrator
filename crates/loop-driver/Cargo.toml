[package]
license.workspace = true
name = "loop-driver"
version = "0.1.0"
edition = "2021"
description = "Single-instance, deadline-bounded Rust driver for bin/loop-tick.sh."

[[bin]]
name = "loop-driver"
path = "src/main.rs"

[lib]
name = "loop_driver"
path = "src/lib.rs"

[dependencies]
loop-switch = { path = "../loop-switch" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
