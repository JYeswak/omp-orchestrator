[package]
name = "omp-orchestrator"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Resident supervisor: observe -> dispatch -> receiver receipt -> escalate"

[[bin]]
name = "omp-orchestrator"
path = "src/main.rs"

[lib]
name = "omp_orchestrator"
path = "src/lib.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
subprocess-contract = { path = "../subprocess-contract" }
receiver-receipt = { path = "../receiver-receipt" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
