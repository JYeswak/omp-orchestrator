[package]
license.workspace = true
name = "omp-orchestrator"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Resident supervisor: observe -> dispatch -> receiver receipt -> escalate"

[[bin]]
name = "omp-orchestrator"
path = "src/main.rs"

[[bin]]
name = "omp-target-dir"
path = "src/bin/omp-target-dir.rs"

[lib]
name = "omp_orchestrator"
path = "src/lib.rs"

[dependencies]
ack-spine = { path = "../ack-spine" }
ack-stage = { path = "../ack-stage" }
agent-mail-native = { path = "../agent-mail-native" }
orchestration-tick-gate = { path = "../orchestration-tick-gate" }
bead-holder = { path = "../bead-holder" }
sender-identity = { path = "../sender-identity" }
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
dispatch-claim-fence = { path = "../dispatch-claim-fence" }
dispatch-silence-watch = { path = "../dispatch-silence-watch" }
composer-typed = { path = "../composer-typed" }
finding = { path = "../finding" }
finding-dispatch = { path = "../finding-dispatch" }
omp-rpc-session = { path = "../omp-rpc-session" }
subprocess-contract = { path = "../subprocess-contract" }
receiver-receipt = { path = "../receiver-receipt" }
ntm-fleet-monitor = { path = "../ntm-fleet-monitor" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
