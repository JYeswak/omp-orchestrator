[package]
license.workspace = true
name = "agent-mail-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native typed binding to Agent Mail's authenticated MCP HTTP surface for the dispatch/ack/comms journey"

[lib]
name = "agent_mail_native"
path = "src/lib.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"
