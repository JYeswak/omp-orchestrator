[package]
license.workspace = true
name = "pane-truth"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Ground-truth tmux pane state; the shell remains the differential oracle."

[lib]
name = "pane_truth"
path = "src/lib.rs"

[[bin]]
name = "pane-truth"
path = "src/main.rs"

[dependencies]
subprocess-contract = { path = "../subprocess-contract" }
tick-monitor = { path = "../tick-monitor" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"
