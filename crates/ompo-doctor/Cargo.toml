[package]
license.workspace = true
name = "ompo-doctor"
version = "0.1.0"
edition = "2021"
publish = false
description = "S1 system doctor: bounded probes and lifecycle-event writer"

[lints]
workspace = true

[lib]
name = "ompo_doctor"
path = "src/lib.rs"

[[bin]]
name = "ompo"
path = "src/main.rs"

[dependencies]
lifecycle-event = { path = "../lifecycle-event", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ntm-kernel = { path = "../ntm-kernel" }
subprocess-contract = { path = "../subprocess-contract" }
ompo-start = { path = "../ompo-start" }
omp-rpc-session = { path = "../omp-rpc-session" }
asupersync = { workspace = true }
omp-orchestrator = { path = "../omp-orchestrator" }


[dev-dependencies]
tempfile = "3"
sha2 = "0.11"

# DECLARED CONSUMPTION of OMP's native `--mode=rpc` surface.
#
# Read by `omp_inventory_map::alignment::index_consumers` off `cargo metadata`, so this is
# DERIVED at read time and never transcribed into a second inventory. Schema verified at
# `crates/omp-inventory-map/src/alignment.rs:372-417`: `metadata.omp_surface.consumes` must be
# an array of objects each carrying non-empty `kind`, `name` and `call_site` strings; a missing
# or empty field is an emitted defect, not a silent skip.
#
# These typed declarations replace the old hand-maintained candidate list. Every method
# below was measured to answer a live OMP process before its verb was written; each is
# reachable as `ompo <verb>`. The model catalog shape was re-measured on omp/18.1.19.
[package.metadata.omp_surface]
consumes = [
    { kind = "rpc_handler", name = "get_state", call_site = "src/omp_state.rs" },
    { kind = "rpc_handler", name = "get_session_stats", call_site = "src/omp_stats.rs" },
    { kind = "rpc_handler", name = "get_messages", call_site = "src/omp_messages.rs" },
    { kind = "rpc_handler", name = "get_available_models", call_site = "src/omp_models.rs" },
    { kind = "daemon_process", name = "omp ps", call_site = "src/omp_process.rs" },
]
