[package]
license.workspace = true
name = "ack-spine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Separate transport, delivery, and acknowledgement authorities"

[[bin]]
name = "ack-spine"
path = "src/main.rs"

[lib]
name = "ack_spine"
path = "src/lib.rs"

[dependencies]
scratch-home = { path = "../scratch-home" }
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }
receiver-receipt = { path = "../receiver-receipt" }
finding = { path = "../finding" }
loop-queue-filter = { path = "../loop-queue-filter" }
tick-monitor = { path = "../tick-monitor" }

[dev-dependencies]
sha2 = "0.11"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
