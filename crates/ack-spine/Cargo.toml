[package]
license.workspace = true
name = "ack-spine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Separate transport, delivery, and acknowledgement authorities"

[[bin]]
name = "ack-spine"
path = "src/main.rs"

[lib]
name = "ack_spine"
path = "src/lib.rs"

[dependencies]
scratch-home = { path = "../scratch-home" }
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
finding = { path = "../finding" }
subprocess-contract = { path = "../subprocess-contract" }
receiver-receipt = { path = "../receiver-receipt" }

[dev-dependencies]
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"
