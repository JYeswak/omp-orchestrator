[package]
license.workspace = true
name = "s1-coverage"
version = "0.1.0"
edition = "2021"
publish = false
description = "Git-tree reproducible S1 requirement coverage matrix"

[lib]
name = "s1_coverage"
path = "src/lib.rs"

[[bin]]
name = "s1-coverage"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
