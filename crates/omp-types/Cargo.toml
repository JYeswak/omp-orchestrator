[package]
license.workspace = true
name = "omp-types"
version = "0.1.0"
edition = "2024"
description = "The canonical type vocabulary. Derived from asupersync at the pinned rev — never invented here."

[lib]
path = "src/lib.rs"

[dependencies]
# Upstream AckKind and DeliveryClass remain behind the messaging-fabric feature, and that feature
# DOES NOT COMPILE at rev fa3c01aec: messaging/consumer.rs:1299-1300 calls constructors
# gated by test-internals. Keep both upstream feature flags disabled here; the local authored
# vocabulary lives in src/ack_vocabulary.rs and mirrors the pinned semantics.
# Enabling test-internals would reintroduce exactly the production leak upstream issue #46 closed.
# The dependency stays on the unchanged workspace pin; no feature is enabled in this crate.
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
subprocess-contract = { path = "../subprocess-contract" }
admission-reason = { path = "../admission-reason" }

[lints.rust]
unsafe_code = "forbid"
