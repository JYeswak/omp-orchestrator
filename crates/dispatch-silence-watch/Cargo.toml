[package]
name = "dispatch-silence-watch"
version = "0.1.0"
edition = "2021"
publish = false
description = "Detects dispatched-then-silent beads: a typed verdict after every dispatch, read back from the tracker — never from a send's exit code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dispatch-silence-watch"
path = "src/main.rs"
