[package]
license.workspace = true
name = "preregistration-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writer-gated hypothesis preregistration for loop evidence"

[lib]
name = "preregistration_gate"
path = "src/lib.rs"

[[bin]]
name = "preregistration-gate"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. {repo}/{scratch} are substituted by the runner rather
# than hardcoded, because a path literal in a manifest is what path-literal-guard
# exists to refuse.
checks = [["--repo", "{repo}"]]
