[package]
license.workspace = true
name = "preregistration-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writer-gated hypothesis preregistration for loop evidence"

[lib]
name = "preregistration_gate"
path = "src/lib.rs"

[[bin]]
name = "preregistration-gate"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"
