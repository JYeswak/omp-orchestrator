[package]
license.workspace = true
name = "scratch-home"
version = "0.1.0"
edition = "2021"
publish = false
description = "Session-scoped, owner-attributed scratch homes for NTM panes"

[[bin]]
name = "scratch-home"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
