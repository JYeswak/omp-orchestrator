[package]
name = "loop-coverage"
version = "0.1.0"
edition = "2021"
description = "Typed coverage matrix for the control-plane dispatch loop. A map, not a gate."

[package.metadata.merge_gate]
blocking = false
reason = "Reports coverage data consumed by other gates; it has no independent merge decision edge."

[lib]
name = "loop_coverage"
path = "src/lib.rs"

[[bin]]
name = "loop-coverage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
