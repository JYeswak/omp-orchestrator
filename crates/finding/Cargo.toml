[package]
license.workspace = true
name = "finding"
version = "0.1.0"
edition = "2024"
description = "A named gap is an obligation: Finding cannot be dropped, only filed or waived."

[lints]
workspace = true

# THE OPERATOR SURFACE (`omp-orchestrator-2sx1`). This crate had 14 manifest
# callers, 19 src callers, and ZERO bin targets, so the only way to file a
# finding was the `br create` the kernel exists to replace. The lib stays the
# single implementation; `src/main.rs` is argv, a runtime, and exit codes.
[[bin]]
name = "finding"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
subprocess-contract = { path = "../subprocess-contract" }

[dev-dependencies]
# An integration test in `tests/` links against the crate and its DEV-dependencies only —
# a normal dependency of the crate is not in scope for it. `Finding::file` takes `&Cx`, so
# the suite cannot construct one without asupersync here. Same git rev as above, so cargo
# unifies rather than resolving a second copy.
asupersync = { workspace = true }
futures-lite = "2"
