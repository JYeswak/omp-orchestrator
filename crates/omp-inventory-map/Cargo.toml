[package]
license.workspace = true
name = "omp-inventory-map"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generated OMP v18 surface and workspace crate inventory map"

[lib]
name = "omp_inventory_map"
path = "src/lib.rs"

[[bin]]
name = "omp-inventory-map"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
text-structure = { path = "../text-structure" }
subprocess-contract = { path = "../subprocess-contract" }
ompo-doctor = { path = "../ompo-doctor" }
# omp-orchestrator-ablcf: %7's extractor supplies the rpc_handler vocabulary. Composed
# rather than reimplemented -- its ANCHOR_METHOD is `negotiate_protocol`, so it extracts the
# mux {id,type} frame names, which is the channel %20's declarations actually name. A second
# bundle parser here would be the duplicate-classifier defect one layer down.
omp-surface-consumption = { path = "../omp-surface-consumption" }

[dev-dependencies]
sha2 = "0.10"

[package.metadata.gate]
# omp-orchestrator-ablcf: this crate's OWN check invocation, so `gate-runner` needs no edit
# when the alignment gate changes. `{repo}` is substituted by the runner, never hardcoded --
# a path literal in a manifest is what path-literal-guard exists to refuse.
#
# WHY THIS BIN AND NOT A NEW GATE: `alignment::align` had thirteen refusing legs and ZERO
# callers, which is the condition it was written to fix. Pane 1 approved attaching to
# `gate-runner --run`, an executor that ALREADY FIRES (GATE_RUNNER_CHECKS executed=16 at
# b57bc7b), rather than minting an eighth uninvoked gate -- crate-atom-gate is 1,701 lines
# with an empty allowance list and zero invocations, and one of those is enough.
#
# This crate is multi-bin, so the phase names a BIN explicitly.
checks = [{ bin = "omp-surface-align", args = ["--repo", "{repo}"] }]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
