[package]
license.workspace = true
name = "fast-dispatch"
version = "0.1.0"
edition = "2021"
description = "Fast dispatch lane: admit on a fresh standing PASS, select FREE panes only, send with bounded children. The former shell differential oracle is DELIBERATELY_NOT until an independent Rust reference is specified."

[[bin]]
name = "fast-dispatch"
path = "src/main.rs"

[lib]
name = "fast_dispatch"
path = "src/lib.rs"

[dependencies]
composer-typed = { path = "../composer-typed" }
loop-switch = { path = "../loop-switch" }
subprocess-contract = { path = "../subprocess-contract" }
tick-monitor = { path = "../tick-monitor" }
finding = { path = "../finding" }
loop-queue-filter = { path = "../loop-queue-filter" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
