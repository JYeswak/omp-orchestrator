[package]
license.workspace = true
name = "fast-dispatch"
version = "0.1.0"
edition = "2021"
description = "Fast dispatch lane: admit on a fresh standing PASS, select FREE panes only, send with bounded children. bin/fast-dispatch.sh remains the differential oracle."

[[bin]]
name = "fast-dispatch"
path = "src/main.rs"

[lib]
name = "fast_dispatch"
path = "src/lib.rs"

[dependencies]
loop-switch = { path = "../loop-switch" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
