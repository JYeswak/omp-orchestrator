[package]
license.workspace = true
name = "tick-monitor"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false
description = "Three repeatable monitors (OMP lifecycle, git commits, idle panes) behind one loop-enforcement choke point"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
lifecycle-event = { path = "../lifecycle-event", default-features = false }
lifecycle-monitor = { path = "../lifecycle-monitor" }
omp-types = { path = "../omp-types" }
[dev-dependencies]
tempfile = "3"
proptest = "1"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
