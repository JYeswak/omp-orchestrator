[package]
license.workspace = true
name = "bead-availability"
version = "0.1.0"
edition = "2021"
publish = false
description = "Live blocker availability with released edges and tri-state unblocks"

[[bin]]
name = "bead-availability"
path = "src/main.rs"

[lib]
name = "bead_availability"
path = "src/lib.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[dev-dependencies]
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"
