[package]
license.workspace = true
name = "plan-assemble"
version = "0.1.0"
edition = "2021"
publish = false
description = "Regenerate docs/PLAN.md from the section files — the in-repo replacement for a /tmp Python script"

[[bin]]
name = "plan-assemble"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
preregistration-gate = { path = "../preregistration-gate" }
# The assembler depends only on the bounded preregistration core and its
# process-boundary runtime. It never shells out through a script; the gate
# reads the committed parent before this binary writes PLAN.md.
[lints.rust]
unsafe_code = "forbid"
