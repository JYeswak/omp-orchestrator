[package]
license.workspace = true
name = "plan-assemble"
version = "0.1.0"
edition = "2021"
publish = false
description = "Regenerate docs/PLAN.md from the section files — the in-repo replacement for a /tmp Python script"

[[bin]]
name = "plan-assemble"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
preregistration-gate = { path = "../preregistration-gate" }
# The assembler depends only on the bounded preregistration core and its
# process-boundary runtime. It never shells out through a script; the gate
# reads the committed parent before this binary writes PLAN.md.
[lints.rust]
unsafe_code = "forbid"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. Table phases name a BIN, which multi-bin crates require:
# measured, gate.yml runs 15 gate bins across 13 crates and this crate hosts three.
# {repo}/{scratch} are substituted by the runner, never hardcoded -- a path literal in
# a manifest is what path-literal-guard exists to refuse.
checks = [[]]
