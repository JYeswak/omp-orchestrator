[package]
license.workspace = true
name = "grader-attribution-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Refuse unattributed and self-grades so grader != implementer is tracker-visible"

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN actor-provenance invocation. The runner
# substitutes {repo}; the manifest must not hardcode a machine-specific path.
checks = [["--ledger", "{repo}/.beads/issues.jsonl"]]

[lib]
name = "grader_attribution_gate"
path = "src/lib.rs"

[[bin]]
name = "grader-attribution-gate"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
