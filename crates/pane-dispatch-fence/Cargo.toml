[package]
license.workspace = true
name = "pane-dispatch-fence"
version = "0.1.0"
edition = "2024"
description = "Cross-process per-pane admission fence for control-plane dispatchers."

[[bin]]
name = "pane-dispatch-fence"
path = "src/main.rs"

[lib]
name = "pane_dispatch_fence"
path = "src/lib.rs"

[dependencies]
asupersync = { workspace = true }
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
