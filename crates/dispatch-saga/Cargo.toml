[package]
license.workspace = true
name = "dispatch-saga"
version = "0.1.0"
edition = "2021"
description = "At-most-one send under a DispatchKey; Unknown is first-class; reconcile by read."

[dependencies]
omp-types = { path = "../omp-types" }
pane-dispatch-fence = { path = "../pane-dispatch-fence" }
grader-attribution-gate = { path = "../grader-attribution-gate" }
blocker-taxonomy = { path = "../blocker-taxonomy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[[bin]]
name = "dispatch-saga"
path = "src/main.rs"


[lints.rust]
unsafe_code = "forbid"
