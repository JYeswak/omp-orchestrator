[package]
license.workspace = true
name = "subprocess-contract"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared cancel-correct process-group and dual-pipe subprocess boundary"

[dependencies]
asupersync = { workspace = true }

[dev-dependencies]
# `code_only` is the shared structure-keyed matcher; no-shell-gate/tests/
# text_structure_lint.rs refuses a local re-implementation.
text-structure = { path = "../text-structure" }
futures-lite = "2"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "platform_scope"
path = "tests/platform_scope.rs"
harness = false
