[package]
license.workspace = true
name = "no-shell-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build gate: refuse tracked .sh/.py files; the exemption list is empty by design"

[dependencies]
crate-atom-gate = { path = "../crate-atom-gate" }
convergence-stamp = { path = "../convergence-stamp" }
orchestration-tick-gate = { path = "../orchestration-tick-gate" }
path-literal-guard = { path = "../path-literal-guard" }
preregistration-gate = { path = "../preregistration-gate" }
state-wildcard-lint = { path = "../state-wildcard-lint" }
pre-delete-citation-check = { path = "../pre-delete-citation-check" }
undrained-pipe-lint = { path = "../undrained-pipe-lint" }
subprocess-contract = { path = "../subprocess-contract" }
staged-build-gate = { path = "../staged-build-gate" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
serde_json = "1"
asupersync-conformance = { path = "../asupersync-conformance" }
text-structure = { path = "../text-structure" }
omp-orchestrator = { path = "../omp-orchestrator" }
