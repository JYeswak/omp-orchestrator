[package]
license.workspace = true
name = "no-shell-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build gate: refuse tracked .sh/.py files; the exemption list is empty by design"

[dependencies]
agent-mail-native = { path = "../agent-mail-native" }
asupersync = { workspace = true }
finding = { path = "../finding" }
crate-atom-gate = { path = "../crate-atom-gate" }
convergence-stamp = { path = "../convergence-stamp" }
orchestration-tick-gate = { path = "../orchestration-tick-gate" }
path-literal-guard = { path = "../path-literal-guard" }
preregistration-gate = { path = "../preregistration-gate" }
state-wildcard-lint = { path = "../state-wildcard-lint" }
pre-delete-citation-check = { path = "../pre-delete-citation-check" }
undrained-pipe-lint = { path = "../undrained-pipe-lint" }
subprocess-contract = { path = "../subprocess-contract" }
omp-inventory-map = { path = "../omp-inventory-map" }
staged-build-gate = { path = "../staged-build-gate" }
r1-breadth-gate = { path = "../r1-breadth-gate" }
doctrine-retirement-gate = { path = "../doctrine-retirement-gate" }
serde_json = "1"
serde_yaml_ng = "0.10"
text-structure = { path = "../text-structure" }
# The hook's CONTENT DIGEST (omp-orchestrator-zzg2x). Declared in BOTH tables on purpose:
# `src/hook_digest.rs` is compiled into the crate AND `include!`d by `build.rs`, so ONE
# implementation serves the stamp and the check. Two hand-written copies of one hash fail
# in the worst direction -- they render a CORRECT hook permanently stale.
sha2 = "0.11"

[build-dependencies]
sha2 = "0.11"


[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
asupersync-conformance = { path = "../asupersync-conformance" }
text-structure = { path = "../text-structure" }
omp-orchestrator = { path = "../omp-orchestrator" }

[package.metadata.gate]
# omp-orchestrator-fsu7: this crate's OWN check invocation, so `gate-runner` needs no
# edit when a gate is added. Table phases name a BIN, which multi-bin crates require:
# measured, gate.yml runs 15 gate bins across 13 crates and this crate hosts three.
# {repo}/{scratch} are substituted by the runner, never hardcoded -- a path literal in
# a manifest is what path-literal-guard exists to refuse.
checks = [
  # HAZARD 2 (omp-orchestrator-etyur): this bin genuinely takes no arguments -- it scans the
  # repo from cwd. `takes_no_args` says so in a key a TRUNCATION cannot invent, because a bare
  # `args = []` is indistinguishable from a half-written stanza and reading it either way only
  # chooses which failure is silent.
  { bin = "no-shell-gate", args = [], takes_no_args = true },
  { bin = "gate-reachability", args = ["--root", "{repo}", "--out", "{scratch}/gate-reachability.json"] },
  { bin = "head-compiles-gate", args = ["--repo", "{repo}", "--receipt", "{scratch}/head-compiles.receipt"] },
]
