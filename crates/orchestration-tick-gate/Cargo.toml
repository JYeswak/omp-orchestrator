[package]
license.workspace = true
name = "orchestration-tick-gate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Callable orchestration tick receipt validator and ledger gate"

[lib]
name = "orchestration_tick_gate"
path = "src/lib.rs"

[[bin]]
name = "orchestration-tick-gate"
path = "src/main.rs"

[dependencies]
crate-atom-gate = { path = "../crate-atom-gate" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
