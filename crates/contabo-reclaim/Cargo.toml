[package]
license.workspace = true
name = "contabo-reclaim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin consumer for the control-plane rch-reclaim-owner contract"
autotests = false

[[bin]]
name = "contabo-reclaim"
path = "src/main.rs"

[[bin]]
name = "fake-rch-reclaim-owner"
path = "tests/fake_rch_reclaim_owner.rs"
[[test]]
name = "reclaimer"
path = "tests/reclaimer.rs"

[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
