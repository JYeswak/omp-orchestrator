[package]
license.workspace = true
name = "contabo-reclaim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Contabo worker reclaimer: shell-conformance sweep port plus the control-plane owner consumer"
autotests = false

[[bin]]
name = "reclaim-sweep"
path = "src/bin/reclaim_sweep.rs"

[[bin]]
name = "contabo-reclaim"
path = "src/main.rs"

[[bin]]
name = "fake-rch-reclaim-owner"
path = "tests/fake_rch_reclaim_owner.rs"

[[bin]]
name = "fake-box-transport"
path = "src/bin/fake_box_transport.rs"
[[test]]
name = "reclaimer"
path = "tests/reclaimer.rs"
[[test]]
name = "sweep_cli"
path = "tests/sweep_cli.rs"
[[test]]
name = "retire_export"
path = "tests/retire_export.rs"
[dependencies]
asupersync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
build-stamp = { path = "../build-stamp" }
