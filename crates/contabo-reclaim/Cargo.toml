[package]
license.workspace = true
name = "contabo-reclaim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fail-closed targeted reclaim of regenerable Contabo artifacts"

[[bin]]
name = "contabo-reclaim"
path = "src/main.rs"

[dependencies]
asupersync = { workspace = true }
subprocess-contract = { path = "../subprocess-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
