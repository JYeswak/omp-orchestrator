[package]
license.workspace = true
name = "extraction-roster"
version = "0.1.0"
edition = "2021"
publish = false
description = "Metadata-derived extraction target and terminal crate roster"

[lib]
name = "extraction_roster"
path = "src/lib.rs"

[[bin]]
name = "extraction-roster"
path = "src/main.rs"

[dependencies]
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "fa3c01aec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subprocess-contract = { path = "../subprocess-contract" }

[lints.rust]
unsafe_code = "forbid"
