# OMP-SURFACE-MAP.toml — the declaration input for the crate census.
#
# THE MISSION (CLAUDE.md, AGENTS.md fifth rule): 100% OMP surface coverage. Every crate declares
# which OMP surface it maps to. A crate absent from this file is UNDECLARED and gets flagged
# exactly as a crate with no caller gets flagged — silence is not an answer, and "none" is.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# REVISION 2, 2026-08-31 20:29Z — MY ORIGINAL CLASSIFICATION WAS REFUTED BY MEASUREMENT.
#
# I published revision 1 with four crates classified (b) reimplemented-by-scraping, on the premise
# that OMP's --mode=rpc offered an alternative we were ignoring. SilverWolf probed the installed
# binary at runtime and answered the deciding question:
#
#   --mode=rpc IS A SINGLE-SESSION TRANSPORT. IT CANNOT ADDRESS A THIRD-PARTY PANE.
#
# Three consequences, each of which INVERTS a row I wrote:
#   * CROSS-PANE DISPATCH IS (a), NOT (b). tmux send-keys and ntm robot-send are the ONLY
#     mechanisms that reach a pane we do not own. Our scraping is CORRECT, not lazy.
#   * OMP PROVIDES NO DELIVERY RECEIPT. My `omp_alternative = "a delivery response on the send"`
#     named something that DOES NOT EXIST. The receiver-verification gap is real and CANNOT be
#     closed by adopting an OMP surface.
#   * THE mux* LAYER IS TUI-ONLY and not reachable from --mode=rpc, so muxConnect/muxPing are not
#     the supervisor's "natural transport" as I claimed.
#
# What SURVIVED as genuine (b): single-session state via get_state, and session continuity via
# --continue/--resume/--session-dir, which we reimplement with pane-id tracking.
#
# THE LESSON, recorded because it cost a revision: I asked the worker to TEST my classification
# rather than confirm it, and the test refuted it. A classification is a CLAIM BY THE AUTHOR. Mine
# was wrong on the largest row, and the correction makes the architecture better news than the
# original finding — most of our scraping is architecturally forced.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# WHY A DECLARATION AND NOT AN INFERENCE: a census that greps crate sources for OMP surface names
# matches its own table. That is the self-referential checker — SIX instances in one session.
#
# CLASSIFICATION, the only three legal values plus the failure state:
#   "a" — genuinely not OMP's concern, OR no OMP alternative exists. A LEGITIMATE TERMINAL STATE.
#   "b" — we reimplemented an OMP surface that EXISTS AND IS REACHABLE. MUST name `omp_alternative`.
#   "c" — an OMP capability we do not use and should.
#   absent — UNDECLARED. The failure state the gate exists to catch.
#
# DENOMINATOR, measured against installed v18.0.11. Re-derive; never inherit:
#   find dist/types -maxdepth 1 -mindepth 1 -type d | wc -l   -> 57
#   omp --help, COMMANDS block                                -> 39
#
# NO-CLAIM: a declaration is a CLAIM BY THE AUTHOR, not a measurement — revision 1 is the proof.
# Adjudication belongs to the inventory map, omp-coverage-mission-ipg.12.
# NO-CLAIM 2 (SilverWolf's, carried): the --mode=rpc probes ran against a no-session, no-tools,
# no-lsp, no-extensions instance. A production session with extensions and LSP is UNMEASURED.

[meta]
revision = 2
denominator_type_dirs = 57
denominator_subcommands = 39
measured_against = "@oh-my-pi/pi-coding-agent v18.0.11"
measured_on = "2026-08-31"
crates_declared = 25
revision_2_reason = "cross-pane dispatch and delivery receipt reclassified (b)->(a); --mode=rpc proven single-session"

# ── (b) REIMPLEMENTED BY SCRAPING — an OMP alternative EXISTS AND IS REACHABLE ───────────────────
# Only two survive revision 2. Both are SINGLE-SESSION concerns, which is exactly the scope where
# --mode=rpc is real.

[crates.dispatch-silence-watch]
classification = "b"
omp_surface = "session"
omp_alternative = "--continue / --resume / --session-dir give real session continuity"
instead_we = "track pane ids and poll for dispatched-then-silent beads"
negative_evidence = "an unclaimed dispatch is invisible to this watcher — measured on 5rh, which sat open with zero comments while a worker carried it. Session continuity would not fix that; the bead projection would still be missing."

[crates.loop-queue-filter]
classification = "b"
omp_surface = "session, task"
omp_alternative = "get_state over --mode=rpc returns structured session state for our OWN session"
instead_we = "filter br ready output and infer state from pane text"
negative_evidence = "if the queue authority is beads rather than OMP, this is (a) — the (b) applies only to the SESSION-state half, not to the queue itself"

# ── (a) NO OMP ALTERNATIVE EXISTS, or genuinely not OMP's concern ────────────────────────────────
# The four cross-pane crates moved here in revision 2. Their scraping is FORCED, not chosen.

[crates.receiver-receipt]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: OMP's --mode=rpc DOES NOT PROVIDE A DELIVERY RECEIPT. Revision 1 named an alternative that does not exist."
instead_we = "diff a timer reset plus a spinner-stripped content hash across two captures"
negative_evidence = "cp-z42vu returned success:[4] while the packet never arrived; the pending-dispatch marker records the inverse. The gap is REAL and cannot be closed by adopting an OMP surface — it can only be closed by a receipt protocol that does not exist today."

[crates.composer-typed]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: inspects a pane we do not own; --mode=rpc is single-session and cannot address it"
negative_evidence = "ntm refuses codex panes with 'cod composer not visible' (cp-nq2s9) while those panes demonstrably accept input — a terminal-inspection false positive that no OMP surface can arbitrate, because OMP cannot see that pane either"

[crates.fleet-composite]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: composes state across panes we do not own"
negative_evidence = "ntm's snapshot returns total_sessions: 0 with success: true when stale; tmux does not lie. A single-session RPC cannot enumerate a fleet."

[crates.tick-monitor]
classification = "a"
omp_surface = "none reachable for CROSS-PANE observation"
why = "REVISION 2: observes OTHER panes. get_state is (b) but only for our OWN session, which this crate does not observe."
instead_we = "classify() matches a braille spinner + elapsed timer on the LAST status line"
negative_evidence = "a stale spinner in scrollback reports a dead pane BUSY forever; two panes read <no marker> because a tool-call box border renders AFTER the status line. Both are scraping artifacts — and both are UNAVOIDABLE while the target pane is not ours."

[crates.omp-orchestrator]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: I claimed omp/muxConnect, muxPing and muxRestartServer were the supervisor's natural transport. The mux* layer is TUI-ONLY and NOT accessible from --mode=rpc. That claim is retired."
negative_evidence = "if a future OMP exposes mux over RPC this becomes (c) immediately — the classification is version-pinned to v18.0.11 and must be re-derived on upgrade"

[crates.ack-stage]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: an acknowledgement requires a receipt, and OMP provides none"
instead_we = "read back a bead comment with br comments list"
negative_evidence = "br comment (singular) prefix-matches, errors on stderr, and EXITS 0 — an agent believed two VERDICT comments landed when neither had. The read-back is load-bearing regardless of transport."

[crates.ack-spine]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: the three-authority split exists because no receipt protocol exists. Revision 1 predicted a real ack would collapse authorities 1 and 3 — measurement says there is no such ack to adopt."
negative_evidence = "if OMP ever ships a delivery receipt, authorities 1 and 3 collapse and this crate shrinks. Until then the split is forced."

[crates.pane-dispatch-fence]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 2: admission for a pane we do not own"
negative_evidence = "safe_to_dispatch is not liveness — a wedged pane accepts a packet, parks it at 'Press up to edit queued messages', and never submits it"

[crates.no-shell-gate]
classification = "a"
omp_surface = "none"
why = "a repo gate over our own tracked files; OMP has no opinion about our .sh policy"
negative_evidence = "if it ever needed to inspect a running agent it would become (b) — it does not; it reads git ls-files"

[crates.pre-delete-citation-check]
classification = "a"
omp_surface = "none"
why = "guards bead-cited paths against deletion; the tracker is beads, not OMP"
negative_evidence = "caught a live specimen — a staged deletion of a path cited in a CLOSED bead's close_reason — with no OMP involvement at any step"

[crates.kernel-bypass-gate]
classification = "a"
omp_surface = "none"
why = "scans our source for handrolled equivalents of our own kernels"
negative_evidence = "it cannot see an operator handrolling in a shell, and all five measured handrolls were in a shell"

[crates.kernel-only-operator-hook]
classification = "a"
omp_surface = "none"
why = "a PreToolUse hook over OUR agent's tool calls, not over OMP's protocol"

[crates.commit-build-fence]
classification = "a"
omp_surface = "none"
why = "refuses a commit while a build is registered in flight; git and cargo, not OMP"

[crates.undrained-pipe-lint]
classification = "a"
omp_surface = "none"
why = "a source lint for the try_wait-without-draining deadlock; a Rust concurrency defect"

[crates.state-wildcard-lint]
classification = "a"
omp_surface = "none"
why = "refuses a wildcard match arm on a state enum so a new variant is a compile error"

[crates.path-literal-guard]
classification = "a"
omp_surface = "none"
why = "refuses hardcoded repo and home paths so the substrate installs anywhere"

[crates.subprocess-contract]
classification = "a"
omp_surface = "none"
why = "the drain-safe cancel-correct process runner; the LAYER BENEATH any client we build"
negative_evidence = "it has 3 callers, the most in the workspace — if an RPC client removed every subprocess spawn it would lose them, and revision 2 says that client cannot exist for cross-pane work"

[crates.finding]
classification = "a"
omp_surface = "none"
why = "the type that makes a named gap an obligation; a tracker concern"
negative_evidence = "it shipped with one manifest caller whose own caller count was zero — reachable only from dead code until the followup stage depended on it"

[crates.finding-dispatch]
classification = "a"
omp_surface = "none"
why = "renders a SupervisorDecision into a filed Finding"
negative_evidence = "ZERO callers, and it is omp-orchestrator's only manifest caller — the supervisor's sole inbound edge is itself dead code. WIRE or RETIRE; there is no third option."

[crates.omp-rpc-session]
classification = "b"
omp_surface = "jsonrpc, session"
omp_alternative = "OMP --mode=rpc with negotiate_protocol v2, get_state, get_session_stats, and get_messages"
instead_we = "drive one OMP child through an asupersync-owned typed stdin/stdout protocol"
negative_evidence = "live quick probe succeeded with negotiated=2, response_count=4, and unknown_frames=3; this does not reach third-party panes or provide a delivery receipt"

[crates.omp-inventory-map]
classification = "b"
omp_surface = "cli, type roots, jsonrpc, slash-commands"
omp_alternative = "direct OMP --help, installed type listings, and RPC startup metadata"
instead_we = "generate an evidence-carrying machine-readable inventory from direct probes and cargo metadata"
negative_evidence = "live map reports UNKNOWN when slash-command startup metadata is incomplete; it does not convert missing probe data into healthy coverage"

[crates.installer]
classification = "a"
omp_surface = "none"
why = "installs repository binaries and launchd configuration; OMP does not own this substrate installation boundary"

[crates.omp-types]
classification = "a"
omp_surface = "none"
why = "the canonical typed vocabulary derived from asupersync; it is not an OMP lifecycle surface"
negative_evidence = "the crate is a workspace type boundary and has no OMP process caller or OMP protocol dependency"

# ── (c) UNUSED CAPABILITY WE SHOULD ADOPT ────────────────────────────────────────────────────────
# Survivors of revision 2, from SilverWolf's per-surface pass on wave .4.

[crates.dispatch-claim-fence]
classification = "a"
omp_surface = "none reachable"
why = "REVISION 3: refuses a packet naming an unclaimed bead. Landed at 02b5f25 and was undeclared here until the surface gate caught it — the gate's first catch of a crate it did not already know about."
negative_evidence = "A DispatchPermit authorizes from a point-in-time `br show --json` projection and explicitly does NOT attest that transport occurred; the dispatch ledger remains the authority for that separate claim. This is the same claim/receipt split that ntm conflates — sender success is not receiver receipt — and the reason the crate exists is that this session dispatched packets naming unclaimed beads twice."
