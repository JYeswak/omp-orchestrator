minimal_repair = "Make S8 the authority for install, identity, build, and rollback; make S1 the human entry/reference surface only, with an explicit cross-reference rather than duplicated install obligations."
owner = "%8 integrator"
verification_method = "For every install, identity, build, and rollback phrase in the index and constitution, resolve exactly one normative owner and verify S1 references S8 instead of claiming the same surface."

