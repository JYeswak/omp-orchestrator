severity = "P1"
class = "OVERLAPPING_INSTALL_AUTHORITY"
affected_ids = ["REQ-008", "INV-011", "WP-008", "HD-0013"]
evidence = [
  "docs/planning/DESIGN_INDEX.md:34-41 says a companion is normative only for the surface named in its row",
  "docs/planning/DESIGN_INDEX.md:106-130 assigns S1 a human-start/install concern and assigns S8 install, identity, build, and rollback",
  "docs/contracts/s1_l0_install.md:1-20 is also the named S1 install contract",
  "docs/PLAN.md:4706-5035 and docs/PLAN.md:7513-7543 place install identity and rollback under the S8 ship surface",
]
