# --- adopted ---------------------------------------------------------------

[[adopted]]
id = "human_interruptions"
denominator = "hd_ask"
countermetric = "illegitimate_escalations"
why = """
Joshua asked for owner-required escalations counted with a denominator.
Pairs with omp-orchestrator-two-escalation-authorities-0lc1 (closed):
legitimate = money / irreversible / API keys; AWAIT_HUMAN otherwise is an
agent stopping early. A count without that taxonomy is a vanity scalar.
"""

[[adopted]]
id = "ready_frontier_utilization"
denominator = "available_agent_slots"
countermetric = "idle_beside_ready_queue"
why = """
AGENTS.md: an idle worker beside a ready queue is the conductor's failure.
Numerator = productive agent slots; denominator = available agent slots
(excluding the orchestrator pane). Countermeteric fires when idle_slots>0
AND ready_beads>0.
"""

