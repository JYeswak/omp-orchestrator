  "S7: validation and bounded build verdict",
  "external: repository HEAD, selected installer target, build_id, installed path, version output, current artifact, and prior artifact",
  "external: installer and staged-build-gate surfaces",
]
outputs = [
  "IdentityCheck with repository, build-id, version, and consistency legs",
  "RestartPostcondition and CargoBuildOutcome",
  "install or rollback evidence consumed by S9 and the operator",
]
dependencies = { hard = ["S7", "external:repository identity", "external:current and prior artifacts"], soft = ["external:RCH release lane", "external:launchd restart/read-back"] }
