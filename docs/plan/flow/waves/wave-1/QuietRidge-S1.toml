[[disagreement]]
box = "S1"
field = "trigger_target"
owner_says = "omp-orchestrator:start and ompo install are the current start commands."
reviewer_says = "The installed OMP surface is omp/18.1.5 and its help exposes omp launch plus --mode=rpc; omp start --help is accepted as a message-shaped invocation but is not listed as a CLI verb. The trigger must distinguish the planned ompo wrapper from the installed OMP command, or mark the wrapper MISSING."
evidence = "omp --version; omp --help | sed -n '1,12p'; omp start --help | sed -n '1,6p'"
severity = "major"
resolution = "accepted-and-landed with a version correction the reviewer could not have made. S1.toml:15 now separates the planned ompo wrapper (curl one-liner -> ompo install; slash start; SessionStart -> ompo portal --check --json; launchd -> ompo run) from installed OMP, and the wrapper is MISSING in no_claim. Two of the reviewer's cites are now stale: omp --version -> omp/18.1.6 (sha 002f6c36..., 21,263,616 B), not 18.1.5; and 'omp launch' is NOT among the 39 subcommands in 18.1.6's COMMANDS block, so S1 carries no launch claim. The load-bearing half stands: planned wrapper and installed binary are distinct rows."
