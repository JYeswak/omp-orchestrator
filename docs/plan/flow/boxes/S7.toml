[[box]]
id = "S7"
name = "validation: eight-gate pre-commit dispatcher"
trigger_today = "hook:pre-commit"
trigger_target = "hook:git pre-commit"
crate = "no-shell-gate; crate-atom-gate; staged-build-gate"
crate_status = "wired"
bead = "omp-orchestrator-d3gm; omp-orchestrator-929j"
kernel_input = "staged paths, staged deletions, repository root, crate facts, and bounded RCH build admission"
kernel_output = "PreCommitOutcome::{Clean, Violation, NothingToCheck} | crate_atom_gate::GateVerdict::{Pass, Refused, Unrun, InstrumentError} | staged_build_gate::CargoBuildOutcome::{Pass, BuildFailed, BuildInconclusive, NotApplicable}"
event_row = "LifecycleEvent{stage_from=S6c, stage_to=S7, actor, pane, incarnation, repo, staged_paths, outcome, gate, reason_code}"
validator = "The installed pre-commit hook reaches pre-registration and plan-assemble prechecks, then six staged-set gates; GATE 7 is staged-build-gate and GATE 8 is crate-atom-gate. RCH admission is required for cargo lanes; the live lane verdict is recorded outside this pure box."
sota_standard = "A validation runner must fail closed on an applicable violation, distinguish an unrun instrument from a refusal, and reject an empty scan rather than calling it clean."
sota_cite = "this-repo:crates/no-shell-gate/src/bin/pre-commit-gate.rs:L1; this-repo:crates/no-shell-gate/src/bin/pre-commit-gate.rs:L3; this-repo:crates/no-shell-gate/src/bin/pre-commit-gate.rs:L22; this-repo:crates/no-shell-gate/src/bin/pre-commit-gate.rs:L94; this-repo:crates/no-shell-gate/src/bin/pre-commit-gate.rs:L300; this-repo:crates/crate-atom-gate/src/lib.rs:L50; this-repo:crates/crate-atom-gate/src/lib.rs:L322; this-repo:crates/staged-build-gate/src/lib.rs:L311; this-repo:docs/plan/flow/CONTRACT.md:L70; runtime:.git/hooks/pre-commit is Mach-O arm64 and strings includes crates/no-shell-gate/src/bin/pre-commit-gate.rs; runtime:rch admit cargo test -p crate-atom-gate => offload; FH_STATUS: STALE SEARCH_INDEX_STALE"
skill = "/oracle-gates, /testing-conformance-harnesses, /rch"
branches = [
  "PreCommitOutcome::Clean",
  "PreCommitOutcome::Violation",
  "PreCommitOutcome::NothingToCheck",
  "crate_atom_gate::GateVerdict::Pass",
  "crate_atom_gate::GateVerdict::Refused",
  "crate_atom_gate::GateVerdict::Unrun",
  "crate_atom_gate::GateVerdict::InstrumentError",
  "staged_build_gate::CargoBuildOutcome::Pass",
  "staged_build_gate::CargoBuildOutcome::BuildFailed",
  "staged_build_gate::CargoBuildOutcome::BuildInconclusive",
  "staged_build_gate::CargoBuildOutcome::NotApplicable",
  "precheck: preregistration-gate refusal",
  "precheck: plan-assemble-build refusal",
  "gate: no-shell-gate",
  "gate: path-literal-guard",
  "gate: undrained-pipe-lint",
  "gate: orchestration-tick-gate",
  "gate: state-wildcard-lint",
  "gate: pre-delete-citation-check",
  "human-halt: owner=josh resolves an unfixable validation refusal",
]
no_claim = "This box records the dispatcher and hook reachability; it does not claim that every gate is semantically complete, that RCH is healthy on every tick, or that a passing validation proves downstream lifecycle success."

# Wave 1 physics. Every number is paired with the command, timestamp, and actor.
[[box.measurement]]
claim = "The dispatcher has eight validation lanes: two prechecks, six staged-set gates, then GATE 7 and GATE 8."
command = "sed -n '1,8p;94,115p;300,345p' crates/no-shell-gate/src/bin/pre-commit-gate.rs"
value = "6 named staged-set gates; preregistration and plan-assemble prechecks; GATE 7 staged-build-gate; GATE 8 crate-atom-gate"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The primary verdict lattices have closed arm sets."
command = "sed -n '22,34p' crates/no-shell-gate/src/bin/pre-commit-gate.rs; sed -n '322,345p' crates/crate-atom-gate/src/lib.rs; sed -n '309,329p' crates/staged-build-gate/src/lib.rs"
value = "PreCommitOutcome=3 arms; crate-atom GateVerdict=4 arms; staged-build CargoBuildOutcome=4 arms"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The crate-atom checklist is nine parts, including wired caller reachability."
command = "sed -n '47,85p' crates/crate-atom-gate/src/lib.rs"
value = "Part::ALL contains 9 entries: Lib, Bin, Verdict, Tests, Fuzz, Claim, Slo, Oracle, WiredCaller"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The local hook reaches the dispatcher binary, and the cargo lane is admissible for remote execution."
command = "file .git/hooks/pre-commit; ls -l .git/hooks/pre-commit; strings .git/hooks/pre-commit | grep -E 'pre-commit-gate|no-shell-gate'; rch admit 'cargo test -p crate-atom-gate'"
value = "Mach-O arm64 executable; strings contains the dispatcher source path; RCH recommendation=offload, family=cargo_test"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The Wave 1 checklist is sixteen classes before the additional diagram, hook, and measurement obligations."
command = "sed -n '70,77p' docs/plan/flow/CONTRACT.md"
value = "9 crate-atom parts + 7 rigor classes = 16"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The owned branch diagram is complete and rendered."
command = "frankenmermaid validate docs/plan/flow/diagrams/S7.mmd --fail-on warning; frankenmermaid render docs/plan/flow/diagrams/S7.mmd --format svg --output docs/plan/flow/diagrams/S7.svg"
value = "validate_exit=0; Nodes=21; Edges=20; rendered SVG present"
measured_at = "2026-09-03T05:33:31Z"
by = "QuietRidge"

