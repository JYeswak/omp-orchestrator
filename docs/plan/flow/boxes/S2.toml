value = "13; 7969"
measured_at = "2026-09-03T05:40Z"
by = "SnowyCanyon"
[[box.measurement]]
claim = "preregistration is nearly empty: the gate guards a ledger with ONE row"
command = "wc -l docs/plan/HYPOTHESES.jsonl docs/plan/FINDINGS.jsonl docs/plan/CONVERGENCE.jsonl"
value = "HYPOTHESES=1, FINDINGS=235, CONVERGENCE=87"
measured_at = "2026-09-03T05:40Z"
by = "SnowyCanyon"
[[box.measurement]]
claim = "plan grading ran 16 hand rounds with no crate"
command = "ls docs/plan/round*.jsonl | wc -l"
value = "16"
measured_at = "2026-09-03T05:40Z"
by = "SnowyCanyon"
[[box.measurement]]
claim = "plan-assemble has 2 in-tree callers and 1 test file"
command = "grep -rl 'plan_assemble\\|plan-assemble' crates/*/src crates/*/Cargo.toml | grep -v crates/plan-assemble/ | wc -l; ls crates/plan-assemble/tests | wc -l"
value = "2; 1"
measured_at = "2026-09-03T05:40Z"
