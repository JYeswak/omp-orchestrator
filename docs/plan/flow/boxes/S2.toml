[[box.measurement]]
claim = "assembly freshness at this instant"
command = "[ docs/PLAN.md -nt \"$(ls -t docs/plan/[0-9][0-9]-*.md | head -1)\" ]"
value = "PLAN.md newer than every section (GREEN at 05:40Z; the row's 'RED on this checkout' was true at 05:2xZ — freshness is a moving reading, which is itself a finding)"
measured_at = "2026-09-03T05:40Z"
by = "SnowyCanyon"

[[box.gap]]
what = "S2 writes no LifecycleEvent row; the plan can change with no journal entry"
resolves = "kxe.8 journal writer + vcd7.1 emit site at plan-assemble's write chokepoint"
class = "event_row"
[[box.gap]]
what = "HYPOTHESES.jsonl holds 1 row for a 7969-line plan: preregistration exists as a gate, not as a practice; 235 FINDINGS have no hypothesis they refute or support"
resolves = "plan-check (bcrn.1) PC-n: every section's load-bearing claims map to a hypothesis row or the section is UNPREREGISTERED"
class = "oracle"
[[box.gap]]
what = "no machine-readable plan items: the only structured form of 01-12 is the hand-made docs/plan/dag/dag-NN.json (567 items)"
resolves = "plan-materialize (n92x) extract stage regenerates them from the sections; differential against the hand manifests"
class = "oracle"
[[box.gap]]
what = "docs/PLAN.md can be hand-edited; plan-assemble is not the sole writer, so assembly_freshness measures mtimes, not authorship"
resolves = "PLAN.md generated-only: a content-hash manifest of consumed sections (12.67) replaces the mtime key; hand edits refused by the pre-commit gate"
class = "gate_trip"
[[box.gap]]
what = "no claim row (L1) for 'the plan is assembled from its sections'; no SLO (L2); no fuzz target on the section parser (L5); no wired-caller test (atom 9)"
resolves = "registries/claims.toml row; slo.yaml row for plan-assemble; fuzz/fuzz_targets/plan_assemble_sections.rs; WIRED_CALLERS in plan-assemble"
class = "claim_row"
[[box.gap]]
what = "no Verdict-typed output: plan-assemble exits, it does not return a Verdictlike over Outcome"
resolves = "lf.1.1 Grade/Verdictlike in omp-types, adopted by plan-assemble"
class = "verdict_type"
[[box.gap]]
what = "S2 -> S3 edge is hand-written (11.5): nothing types 'the plan is ready to grade'"
resolves = "plan-assemble emits PlanAssembled{content_hash, sections[]} consumed by plan-check as its input"
class = "event_row"
[[box.gap]]
what = "no per-box diagram; branches exist only as prose strings"
resolves = "docs/plan/flow/diagrams/S2.mmd from branches; frankenmermaid validate --fail-on warning"
class = "diagram"
[[box.gap]]
what = "no hook row: the pre-commit gate is the only hook, and it is per-clone and hand-installed (588v)"
resolves = "hooks_certified.toml row for the pre-commit dispatcher with source_commit + stage; ompo install --hooks writes it"
class = "hook"

