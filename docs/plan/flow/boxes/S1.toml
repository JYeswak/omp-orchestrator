layer = "L0"
status = "PROPOSED"
event_row = "LifecycleEvent{stage_to='S1.L0', step, actor, outcome, reason_code, blocker}  -- one row per step, not one per install"
reason_codes = ["TRIPLE_RESOLVED", "PREFLIGHT_REFUSED_DISK", "SUPPLY_CHAIN_REFUSED_CHECKSUM", "SUPPLY_CHAIN_REFUSED_SIGNATURE", "PATH_COLLISION_REFUSED", "AGENT_DETECTED", "AGENT_MERGE_CREATED", "AGENT_MERGE_MERGED", "AGENT_MERGE_ALREADY", "AGENT_MERGE_SKIPPED", "AGENT_MERGE_FAILED", "BACKUP_WRITTEN", "INSTALL_VERIFIED", "UNINSTALL_CLEAN"]
