live_definition = "THREE FRESHNESS-BEARING SOURCES agree on the pane set, each with available/fresh/reason_code/age_ms; one SILENT source makes the swarm NOT-live even if the other two agree. RAW `tmux has-session` IS NOT A SOURCE -- refuted by pane 4 at 6238c0f: it is a boolean exit with no freshness field, so a known-bad leg over it is unconstructible (docs/contracts/s1_l4_liveness.md LAW-L4-NO-TMUX-RAW, L4P-NO-RAW-TMUX). Owner ACCEPTS the refutation; the prior wording named tmux has-session and was wrong."
