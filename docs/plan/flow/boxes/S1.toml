known_bad = "a TAMPERED checksum must REFUSE, never warn. Zero agents detected is an ERROR, not 'clean' -- an empty scan set is the anti-vacuity case. And the published name must not be a PATH shadow: bare `installer` resolves to /usr/sbin/installer today."
metric = "install -> verified-PATH seconds; path_hits count (>1 is a collision, not a note); backups_written : files_mutated must be exactly 1:1"

