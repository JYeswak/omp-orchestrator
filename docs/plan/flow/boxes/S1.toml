monitor = "command -v ompo readback AFTER the install, plus an inode compare of the installed artifact against the staged one. mirror:beads_rust/src/sync/mod.rs:507-509 fsync_pinned_parent() is the durability reference; mirror:destructive_command_guard/install.sh:1708-1712 does NOT fsync the parent, which is the gap between the two."
