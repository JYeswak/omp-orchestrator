known_bad = "TWO sources agreeing and one SILENT must be NOT-live, never live -- silence is not assent. A partial swarm must refuse, not degrade. And the am roster is measured unfit as a sole authority: 36 rows whose freshest last_active was 1h stale while four panes were working."
metric = "source agreement rate; spawn -> three-source-agreed latency; partial-swarm count (must be 0); per-source staleness age_ms"

[[box.observability]]
layer = "L5"
status = "PROPOSED"
event_row = "the PortalRow snapshot itself, plus one_next_action and decisions_owed[] with each decision's age"
reason_codes = ["ENVELOPE_WRITTEN", "READBACK_FAILED_REFUSED", "FOUNDATION_ROW_APPENDED", "DECISION_OWED_HUMAN_HALT"]
artifact = ".omp-orchestrator/inception.json complete (SCHEMAS.toml:156-161) + a FOUNDATION.jsonl stage=S1 row + the jq readback output"
monitor = "THE READBACK IS THE MONITOR. Write, fsync the FILE and its PARENT DIRECTORY (F_FULLFSYNC on macOS; mirror:beads_rust/src/sync/mod.rs:507-509 called as a PostRename hook at :2425), rename, then jq the fields back. Envelope shape adopts ntm's schema_id + schema_version + a content hash, and am robot status's refusal triple severity+summary+action."
gate = "envelope gate"
known_bad = "a write that RETURNS ZERO but whose readback fails must REFUSE. That is the whole point: 'the write succeeded' is not evidence the artifact exists, and inception.json has zero instances on disk today while being declared since SCHEMAS.toml was written."
metric = "write -> readback success rate (must be 100%); decisions_owed age (the age is the signal, not the count); crash-injection survival between write and rename"
