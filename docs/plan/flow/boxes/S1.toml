# ---- OBSERVABILITY, one row per layer. Bead: omp-orchestrator-s1-observability-every-layer-io0r
#
# JOSHUA, 2026-09-03: "why would we not have observability at every layer - this seems like a
# massive gap". He is right. Three measured causes, recorded so the fix is not mistaken for a
# preference:
#
#   1. OUR OWN GRADING RULE SCOPED IT OUT. crate-atom-gate part 7 (the SLO row) is conditional on
#      the crate sitting on a TICK PATH -- crates/crate-atom-gate/src/lib.rs:64-65, field at
#      :174-176. Inception is not a tick path, so the gate NEVER ASKED for an SLO row for L0-L5.
#      The instrument that grades all 68 crates excused the whole journey. Part 7's trigger must
#      widen: a JOURNEY STAGE qualifies, not only a tick path.
#   2. EVERY OBSERVABILITY PRIMITIVE HERE IS SCAR TISSUE. tick-monitor exists because pane
#      classifiers were wrong; receiver-receipt because a send returned success while the packet
#      vanished; ack-stage because delivery was unprovable. Each was forced into existence by a
#      failure. Inception has never executed, so it has no scars -- which is exactly why the first
#      run would be blind at the moment we most need to watch it.
#   3. DECLARED IS NOT BUILT. Line 21 of this file declares the LifecycleEvent row. Zero writers.
#      All nine writer files in the workspace serve the DISPATCH LOOP. Two declared artifacts have
#      zero instances on disk: SCHEMAS.toml:156 inception_manifest and :138 findings_ledger.
#
# Every row below is PROPOSED. Writing them instruments nothing; it makes the requirement checkable
# before the build, which is the only cheap moment. Each row carries the four things a layer needs
# -- an event with a reason_code SET, the artifact it writes, the monitor that watches it, and the
# gate that grades it WITH its known-bad leg -- plus one metric.

