# S1 — human start. DRAFT, PENDING JOSHUA'S APPROVAL (2026-09-03, orchestrator pane 1).
# Joshua's stated preference, verbatim intent: "layered - installable binary with friendly process -
# checks system, checks ecosystem, walks a user through installing it. once installed, its triggered
# through slash commands (skills) that start up a scripted process and instructs agents how to follow
# it. easy ways to liven it up and enter the 'portal'. is swarm already live or not - if not it needs
# to ask what types agents - and spawn an ntm session with appropriate agents and context packs. it
# needs to check agents.md and claude.md, check / install hooks. what hooks - every layer defined."
# Approval state: status = "draft"; decisions HD-0009..HD-0012 in docs/decisions.jsonl gate the pin.

[[box]]
id = "S1"
name = "human start: install -> system check -> ecosystem check -> walkthrough -> swarm live? -> portal"
status = "draft"
trigger_today = "generic SessionStart plus launchd ai.zeststream.omp-orchestrator run exist; S1-specific slash start and portal --check are not wired"
trigger_target = "curl one-liner (prebuilt binary, no .sh in tree) -> ompo install; then slash:/omp-orchestrator:start; SessionStart hook -> ompo portal --check --json; launchd -> ompo run"
crate = "installer"
crate_status = "exists-no-caller"
bead = "omp-orchestrator-plf.7.2 (umbrella), plf.7.3 (doctor), lf.7.12 (init), kxe.10 (inception), f.7.1.5 (operator setup)"
kernel_input = "PROPOSED InstallPlan{platform, dest_name=ompo, agents[], hooks_to_merge[], skills[]} | Probe{name, family, present, version, remediation} | intake.requirements.fleet -> persona A|B|C | EcosystemProbe | SwarmState{session, panes, sources_agree}"
kernel_output = "PROPOSED InstallReport{agent -> created|merged|already|failed|skipped, backups[], path_hits[]} | DoctorReport{ok|degraded|absent|unprobeable} | Inception{schema_version, project_id, repo_identity, control_files, host_capabilities, required_tools, trust_status} | PortalRow{session, panes, queue_by_bv, admission, gates, liveness_per_source, one_next_action, decisions_owed}"
event_row = "LifecycleEvent{stage_from=HUMAN, stage_to=S1.<L0..L5>, actor, pane, incarnation, outcome, reason_code, blocker}"
validator = "installer --check identity (this-repo:crates/installer/src/lib.rs:86 IDENTITY MISMATCH); doctor two-band exit (plf.7.3); crate-atom-gate d3gm over the umbrella"
sota_standard = "installer-workmanship 24 non-negotiables (skill ~/.claude/skills/installer-workmanship/SKILL.md) implemented in Rust; three-source liveness (tmux + tick-monitor + Agent Mail agree) per AGENTS.md One Rule"
