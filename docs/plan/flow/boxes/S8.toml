[[box]]
id = "S8"
name = "install and rollback: identity-checked supervisor artifact"
trigger_today = "hand"
trigger_target = "hand:installer --check | installer --install <target>"
crate = "installer; staged-build-gate"
crate_status = "exists-no-caller"
bead = "omp-orchestrator-sor6; omp-orchestrator-jplf.7.20"
kernel_input = "repository HEAD, selected installer target, build_id, installed binary path, version output, current artifact, and prior artifact for rollback"
kernel_output = "IdentityCheck{binary_name, repo_ownership, head_sha, build_id_in_binary, version_output, consistent} | RestartPostcondition | CargoBuildOutcome::{Pass, BuildFailed, BuildInconclusive, NotApplicable}"
event_row = "LifecycleEvent{stage_from=S7, stage_to=S8, actor, pane, incarnation, binary, head_sha, build_id, inode, rollback, outcome, reason_code}"
validator = "installer --check exercises the build_id/version identity legs; RCH admits the release build on the pinned contabo-3 lane; staged-build-gate classifies the cargo result; install_binary verifies the staged copy before atomic replacement; jplf.7.20 supplies the prior-binary rollback transcript."
sota_standard = "Installation is a controlled ownership transfer: identify the source artifact, reject identity drift before replacement, preserve the prior artifact, and verify the restart or rollback postcondition with a bounded build lane."
sota_cite = "this-repo:crates/installer/src/main.rs:L13; this-repo:crates/installer/src/main.rs:L36; this-repo:crates/installer/src/lib.rs:L165; this-repo:crates/installer/src/lib.rs:L186; this-repo:crates/installer/src/lib.rs:L196; this-repo:crates/installer/src/lib.rs:L344; this-repo:crates/installer/src/lib.rs:L664; this-repo:crates/installer/src/lib.rs:L705; this-repo:crates/installer/src/lib.rs:L716; this-repo:crates/staged-build-gate/src/lib.rs:L311; this-repo:.cargo/config.toml:L9; this-repo:.cargo/config.toml:L35; this-repo:docs/plan/flow/CONTRACT.md:L70; runtime:rch admit cargo build --release -p installer => offload; FH_STATUS: STALE SEARCH_INDEX_STALE"
skill = "/installer-workmanship, /release-preparations, /rch"
branches = [
  "RepoOwnership::ThisRepo",
  "RepoOwnership::Foreign { repo }",
  "RepoOwnership::Unknown",
  "IdentityCheck::identity_legs=build_id,version",
  "IdentityCheck::identity_legs=build_id",
  "IdentityCheck::identity_legs=version",
  "IdentityCheck::identity_legs=none",
  "RestartPostcondition::Verified",
  "RestartPostcondition::NotRestarted",
  "RestartPostcondition::NotRunning",
  "RestartPostcondition::IdentityMismatch",
  "CargoBuildOutcome::Pass",
  "CargoBuildOutcome::BuildFailed",
  "CargoBuildOutcome::BuildInconclusive",
  "CargoBuildOutcome::NotApplicable",
  "human-halt: owner=josh approves a restart or rollback after identity refusal",
]
no_claim = "This box records installer identity, bounded build classification, and rollback evidence; it does not prove launchd continuity, receiver liveness, delivery, or that an installed artifact matches the current workspace unless the identity legs pass."

# Wave 1 physics. Every number is paired with the command, timestamp, and actor.
[[box.measurement]]
claim = "The installer exposes four tracked binaries and bounded CLI verbs."
command = "sed -n '11,18p;35,50p' crates/installer/src/main.rs"
value = "BINARIES=4; verbs include --check, --install <target>, --version, --help"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "Identity and restart classification are closed over four-way branches."
command = "sed -n '164,192p;195,232p' crates/installer/src/lib.rs"
value = "RepoOwnership=3 arms; identity_legs=4 outcomes; RestartPostcondition=4 arms"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The installer has a build fence and verifies the staged artifact before atomic replacement."
command = "sed -n '344,407p;664,716p' crates/installer/src/lib.rs"
value = "build fence check; staged copy; identity verification; atomic same-filesystem rename"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The shared cargo result classifier has four arms and admits only Pass."
command = "sed -n '309,329p' crates/staged-build-gate/src/lib.rs"
value = "CargoBuildOutcome=4 arms: Pass, BuildFailed, BuildInconclusive, NotApplicable"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The repo pins this lane to contabo-3 and RCH admits the installer release build remotely."
command = "sed -n '1,35p' .cargo/config.toml; rch admit 'cargo build --release -p installer'"
value = "RCH_WORKER=contabo-3; RCH recommendation=offload, family=cargo_build"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "Installer test and rollback evidence is incomplete in the current tree."
command = "[ -d crates/installer/tests ] && echo tests_dir=PRESENT || echo tests_dir=MISSING; grep -R -n -E 'rollback|prior binary' crates/installer docs/plan/dag | head -20"
value = "tests_dir=MISSING; rollback references exist in source and plan, but no persisted rollback transcript was found"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The Wave 1 checklist is sixteen classes before the additional diagram, hook, and measurement obligations."
command = "sed -n '70,77p' docs/plan/flow/CONTRACT.md"
value = "9 crate-atom parts + 7 rigor classes = 16"
measured_at = "2026-09-03T05:31:12Z"
by = "QuietRidge"

[[box.measurement]]
claim = "The owned branch diagram is complete and rendered."
command = "frankenmermaid validate docs/plan/flow/diagrams/S8.mmd --fail-on warning; frankenmermaid render docs/plan/flow/diagrams/S8.mmd --format svg --output docs/plan/flow/diagrams/S8.svg"
value = "validate_exit=0; Nodes=17; Edges=16; rendered SVG present"
measured_at = "2026-09-03T05:33:31Z"
by = "QuietRidge"

# Wave 1 gap walk. PRESENT means the class has evidence; PARTIAL and MISSING remain blockers.
