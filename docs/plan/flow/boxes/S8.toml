class = "oracle(L3)"
[[box.gap]]
what = "rigor.L4.gate_trip: PARTIAL — source refuses identity drift and build failures, but no current rollback transcript proves the end-to-end gate trip"
resolves = "jplf.7.20: run the rollback acceptance with exit_code=0 and rollback=true"
