class = "atom.3.verdict_type"
[[box.gap]]
what = "atom.4.tests: MISSING — no crates/installer/tests target; inline unit tests do not satisfy the external contract target"
resolves = "jplf.7.20: add a real install-over-existing-artifact and rollback integration target"
class = "atom.4.tests"
[[box.gap]]
what = "atom.5.fuzz: MISSING — no installer identity or rollback fuzz target"
resolves = "MISSING: add fuzz/fuzz_targets/installer_identity.rs or a named d3gm allowance"
class = "atom.5.fuzz"
[[box.gap]]
what = "atom.6.claim: MISSING — no claim registry row for identity-safe replacement"
