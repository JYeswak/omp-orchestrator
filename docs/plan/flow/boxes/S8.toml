resolves = "none; preserve the source-backed kernel"
class = "atom.1.lib"
[[box.gap]]
what = "atom.2.bin: PRESENT — installer has a Rust binary target"
resolves = "none; retain the CLI target and identity marker"
class = "atom.2.bin"
[[box.gap]]
what = "atom.3.verdict_type: PRESENT — RestartPostcondition and CargoBuildOutcome are typed"
