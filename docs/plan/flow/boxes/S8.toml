[[box.gap]]
what = "rigor.L5.fuzz: MISSING — no adversarial predecessor/build-id corpus"
resolves = "MISSING: add installer fuzz inputs for foreign, unknown, and mismatched artifacts"
class = "fuzz(L5)"
[[box.gap]]
what = "rigor.L6.formal: MISSING — no formal invariant for preserve-before-replace and identity refusal"
resolves = "MISSING: add a formal/conformance witness or escalate the assurance decision"
class = "formal(L6)"
[[box.gap]]
what = "rigor.L7.lock: PARTIAL — .build_in_flight is checked, but cross-process ownership and rollback locking are not independently proven"
resolves = "MISSING: add a lock contention test and certified ownership row"
