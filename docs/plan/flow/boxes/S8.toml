class = "atom.6.claim"
[[box.gap]]
what = "atom.7.slo: MISSING — no install or rollback SLO row"
resolves = "MISSING: add bounded install latency and rollback completion SLOs"
class = "atom.7.slo"
[[box.gap]]
what = "atom.8.oracle: MISSING — no independent artifact oracle compares predecessor and installed bytes/build IDs"
