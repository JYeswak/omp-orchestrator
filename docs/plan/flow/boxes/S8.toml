[[box.gap]]
what = "rigor.L1.claim_row: MISSING — install identity is not registered as a load-bearing claim"
resolves = "MISSING: add the claim row and source pin"
class = "claim_row(L1)"
[[box.gap]]
what = "rigor.L2.slo: MISSING — no measured install/rollback performance floor"
resolves = "MISSING: add the SLO row and bounded measurement"
