  "report status `MISSING` -> file one bead labelled crate:<name> part:<n>",
  "PROPOSED: bead already exists for (crate, part) -> AlreadyFiled, never a duplicate",
  "PROPOSED: filed bead fails bead-lint -> RefusedByLint{reason}; the materializer must not emit a bead its own linter rejects",
  "PROPOSED: report absent or exit 2 (SCAN_EMPTY) / exit 3 (INSTRUMENT_ERROR) -> ReportUnrun; the materializer files NOTHING on an unrun report",
  "human-halt arm: a MISSING part whose remedy is a decision (e.g. retire the crate vs wire it) -> S9 request row",
]
