EXPECTED to refuse with CEILING_HAS_SLACK or CEILING_BREACHED wherever the two disagree.
Filing beads from that first report before reconciling would materialise the disagreement
as work.
ALSO NOT ESTABLISHED: that `arrow:` labels exist on any bead today. My d3gm bead carries
`crate:crate-atom-gate` and `part:1` and `arrow:S4-S5`, so the convention is real on at
least one bead — but I did not survey the tracker for coverage, so bead-lint's refusal rate
against the existing corpus is UNMEASURED.
