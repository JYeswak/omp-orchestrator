<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4282.375 250.5" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="flowchart-v2" data-nodes="14" data-edges="13" data-type="flowchart" data-detail-tier="rich"><title>flowchart diagram</title><desc>A flowchart diagram with 14 nodes and 13 edges. flowing left to right. Key nodes: human_start, S1 inception, S2 idea to plan.. Key relationships: human_start points to S1 inception; S1 inception points to S2 idea to plan; S2 idea to plan points to S3 plan grade.. Layout spans 4202 by 170 units with 14 rendered node boxes and 13 routed edge paths.</desc><style>svg{--fm-bg: #fafbfc;--fm-text-color: #1e293b;--fm-node-fill: #ffffff;--fm-node-stroke: #cbd5e1;--fm-edge-color: #64748b;--fm-cluster-fill: rgba(241,245,249,0.65);--fm-cluster-stroke: #94a3b8;--fm-accent-1: #4f46e5;--fm-accent-2: #0284c7;--fm-accent-3: #0d9488;--fm-accent-4: #7c3aed;--fm-accent-5: #d97706;--fm-accent-6: #db2777;--fm-accent-7: #059669;--fm-accent-8: #e11d48;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 3%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 97%,var(--fm-node-stroke) 3%) 100%)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-stroke);--fm-node-hover-accent:var(--fm-edge-color)}.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon{fill:var(--fm-node-fill);stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision;filter: drop-shadow(0 1px 3px rgba(15,23,42,0.08)) drop-shadow(0 1px 2px rgba(15,23,42,0.04));transition:fill 150ms ease,stroke 150ms ease,filter 150ms ease}.fm-node.fm-node-user-mindmap-no-border rect,.fm-node.fm-node-user-mindmap-no-border path,.fm-node.fm-node-user-mindmap-no-border polygon{stroke:none}.fm-node line{stroke:var(--fm-node-accent);stroke-width:1.25;vector-effect:non-scaling-stroke}.fm-node text{fill:var(--fm-text-color);font-weight:500;letter-spacing:-.015em;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1,"calt" 1}.fm-node:hover rect,.fm-node:hover path,.fm-node:hover circle,.fm-node:hover ellipse,.fm-node:hover polygon{stroke:var(--fm-node-hover-accent);filter: drop-shadow(0 4px 12px rgba(15,23,42,0.12)) drop-shadow(0 2px 4px rgba(15,23,42,0.06));}.fm-node-accent-1{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-1) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-1)}.fm-node-accent-2{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-2) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-2)}.fm-node-accent-3{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-3) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-3)}.fm-node-accent-4{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-4) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-4)}.fm-node-accent-5{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-5) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-5)}.fm-node-accent-6{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-6) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-6)}.fm-node-accent-7{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-7) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-7)}.fm-node-accent-8{--fm-node-accent:var(--fm-node-stroke);--fm-node-accent:color-mix(in srgb,var(--fm-accent-8) 50%,var(--fm-node-stroke));--fm-node-hover-accent:var(--fm-accent-8)}.fm-edge{fill:none;stroke:var(--fm-edge-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke;transition:stroke 150ms ease,opacity 150ms ease,stroke-width 150ms ease;cursor:default}.fm-edge:hover{stroke:var(--fm-accent-1);stroke-width:2.25;opacity:1}.fm-edge-solid{stroke-dasharray:none}.fm-edge-back{stroke:var(--fm-edge-muted);opacity:.8;stroke-dasharray:4 4}marker#arrow-end path{fill:var(--fm-edge-color);stroke:none;transition:fill 150ms ease}.fm-edge:hover~marker#arrow-end path{fill:var(--fm-accent-1)}.fm-label{fill:var(--fm-text-color)}@media (prefers-reduced-motion:reduce){.fm-node rect,.fm-node path,.fm-node circle,.fm-node ellipse,.fm-node polygon,.fm-edge{transition:none;transform:none}}.fm-node:focus-visible{outline:2px solid var(--fm-accent-1);outline-offset:3px}.fm-node-inactive{opacity: 0.40;}.fm-cluster{fill-opacity: 0.06;}/* High contrast mode support */ @media (prefers-contrast: more){svg,:root{--fm-bg: #ffffff !important;--fm-text-color: #000000 !important;--fm-node-fill: #ffffff !important;--fm-node-stroke: #000000 !important;--fm-edge-color: #000000 !important;}.fm-node{stroke-width: 2px !important;}.fm-edge{stroke-width: 2px !important;}}/* Reduced motion support */ @media (prefers-reduced-motion: reduce){.fm-edge,.fm-node{animation: none !important;transition: none !important;}}/* Focus indicators for keyboard navigation */ .fm-node:focus,.fm-edge:focus{outline: 3px solid #0066cc;outline-offset: 2px;}.fm-node:focus-visible,.fm-edge:focus-visible{outline: 3px solid #0066cc;outline-offset: 2px;}/* Screen reader only content */ .fm-sr-only{position: absolute;width: 1px;height: 1px;padding: 0;margin: -1px;overflow: hidden;clip: rect(0,0,0,0);white-space: nowrap;border: 0;}@media print{.fm-node text,.fm-edge-labeled text,.fm-cluster-label{font-size: 8.0px !important;fill: #111 !important;}.fm-node path,.fm-node rect,.fm-node circle,.fm-edge{stroke: #111 !important;}.fm-cluster{fill: #fff !important;stroke: #666 !important;}#fm-node-gradient stop{stop-color: #fff !important;stop-opacity: 1 !important;}}</style><defs><marker id="arrow-end" markerWidth="8" markerHeight="7" refX="8" refY="3.50" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 3.50 L0 7 L2 3.50 Z" fill="#64748b"/></marker><linearGradient id="fm-node-gradient" x1="0.0%" y1="0.0%" x2="0.0%" y2="100.0%"><stop offset="0.0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="55.0%" stop-color="#ffffff" stop-opacity="0.97"/><stop offset="100.0%" stop-color="#fafbfc" stop-opacity="0.92"/></linearGradient></defs><g id="fm-edge-0" class="fm-edge" data-fm-edge-id="0" data-fm-source-span="2:1-2:41@0-0" role="graphics-symbol" tabindex="0"><path d="M246.50 125.25 L366.50 125.25" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="0" marker-end="url(#arrow-end)" data-fm-source-span="2:1-2:41@0-0"/><title>human_start points to S1 inception</title></g><g id="fm-edge-1" class="fm-edge" data-fm-edge-id="1" data-fm-source-span="3:1-3:30@0-0" role="graphics-symbol" tabindex="0"><path d="M520.17 125.25 L640.17 125.25" stroke-width="1.80" class="fm-edge fm-edge-solid" data-fm-edge-id="1" marker-end="url(#arrow-end)" data-fm-source-span="3:1-3:30@0-0"/><title>S1 inception points to S2 idea to plan</title></g><g id="fm-edge-2" class="fm-edge" data-fm-edge-id="2" data-fm-source-span="4:1-4:28@0-0" role="graphics-symbol" tabindex="0"><path d="M810.35 125.25 L930.35 125.25" stroke-width="1.80" class="fm-edge